<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcours Power Apps : de débutant à expert</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f7;--bg3:#f2f2f2;--text:#171717;--text2:#505050;--border:#e3e3e3;
  --accent:#0f6cbd;--accent-h:#115ea3;--accent-bg:#ebf3fc;--link:#0065b3;
  --ok:#107c10;--ok-bg:#dff6dd;--ko:#c50f1f;--ko-bg:#fde7e9;--warn:#8a5a00;--warn-bg:#fff4ce;
  --reza:#b10e1c;--reza-bg:#fdecec;--purple:#742774;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.11);
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1f;--bg2:#262626;--bg3:#2e2e2e;--text:#f2f2f2;--text2:#bdbdbd;--border:#3a3a3a;
  --accent:#479ef5;--accent-h:#62abf5;--accent-bg:#082338;--link:#75b6e7;
  --ok:#54b054;--ok-bg:#0d2b0d;--ko:#f1707b;--ko-bg:#3b1013;--warn:#f2c661;--warn-bg:#3a2f0d;--reza:#ff8a8a;--reza-bg:#3a1515;--purple:#d59dff;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#1f1f1f;--bg2:#262626;--bg3:#2e2e2e;--text:#f2f2f2;--text2:#bdbdbd;--border:#3a3a3a;
  --accent:#479ef5;--accent-h:#62abf5;--accent-bg:#082338;--link:#75b6e7;
  --ok:#54b054;--ok-bg:#0d2b0d;--ko:#f1707b;--ko-bg:#3b1013;--warn:#f2c661;--warn-bg:#3a2f0d;--reza:#ff8a8a;--reza-bg:#3a1515;--purple:#d59dff;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.5);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
a:hover{color:var(--accent-h)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
button,input{font:inherit;color:inherit}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;height:54px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:600;font-size:17px;white-space:nowrap}
.brand:hover{color:var(--text)}
.logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--purple));position:relative;display:inline-block}
.logo i{display:none}
.logo::after{content:"";position:absolute;inset:6px 6px 6px 8px;border-left:2px solid #fff;border-bottom:2px solid #fff;border-radius:0 0 0 2px;opacity:.9}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;background:transparent;border-radius:4px;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--bg3)}
.menu-btn{display:none}

/* Search */
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:34px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:4px;background:var(--bg);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.search-ic{position:absolute;left:10px;top:9px;color:var(--text2);display:flex}
.search-pop{position:absolute;top:40px;left:0;right:0;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 6.4px 14.4px rgba(0,0,0,.18);max-height:70vh;overflow:auto;padding:4px}
.search-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:4px;cursor:pointer}
.search-item.on{background:var(--accent-bg)}
.search-item .kind{flex:none;font-size:12px;color:var(--text2);width:72px;padding-top:2px}
.search-item .st{display:flex;flex-direction:column;min-width:0}
.search-item small{color:var(--text2);font-size:13px}
.search-empty{padding:12px;color:var(--text2);font-size:14px}

/* Layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100% - 54px)}
.side{border-right:1px solid var(--border);background:var(--bg)}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);max-height:calc(100vh - 54px);overflow:auto;padding:20px 12px 40px 16px;font-size:14px}
.toc-h{font-size:13px;font-weight:600;color:var(--text2);padding:0 8px 8px}
.toc a{display:block;text-decoration:none;color:var(--text);padding:5px 8px;border-radius:4px;border-left:2px solid transparent}
.toc a:hover{background:var(--bg3);color:var(--text)}
.toc a.cur{background:var(--accent-bg);border-left-color:var(--accent);font-weight:600}
.toc-top{font-weight:600}
.toc-mod-btn{display:flex;gap:4px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 6px;border-radius:4px;cursor:pointer;line-height:1.35}
.toc-mod-btn:hover{background:var(--bg3)}
.toc-mod-btn.act{color:var(--accent)}
.toc-mod-btn .mnum{display:block;font-size:12px;color:var(--text2)}
.chev{display:inline-flex;padding-top:3px;transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.toc-sub{margin:2px 0 8px 22px;border-left:1px solid var(--border)}
.toc-sub a{margin-left:-1px;line-height:1.35;padding:5px 10px}
.toc-sub a.tool{display:flex;gap:6px;align-items:center;color:var(--text2)}
.toc-sep{height:1px;background:var(--border);margin:12px 8px}
.scrim{display:none}
main{outline:none;min-width:0}
main:focus,main:focus-visible{outline:none}
.page{max-width:820px;padding:28px 40px 72px}

/* Typography */
h1{font-size:2rem;line-height:1.25;font-weight:600;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600;line-height:1.3}
.lead{font-size:1.075rem;color:var(--text2);max-width:68ch;margin:0 0 24px}
.eyebrow{margin:0;color:var(--text2);font-size:14px}
.crumbs{font-size:14px;color:var(--text2);margin-bottom:16px}
.crumbs a{text-decoration:none}
.crumbs .sep{margin:0 8px;color:var(--border)}
.sec-h{margin:32px 0 12px}
.muted{color:var(--text2);font-size:14px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:4px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-decoration:none;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--bg3);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--link);padding:0;cursor:pointer;font-size:14px;text-decoration:underline}

/* Home */
.hero{padding:28px 0 8px}
.hero-kicker{margin:0 0 6px;color:var(--purple);font-weight:600;font-size:15px}
.hero h1{font-size:2.5rem;max-width:20ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px 24px;margin-top:32px}
.card h2{margin:0 0 8px}
.card p{margin:0 0 10px;max-width:70ch}
.note{font-size:14px;color:var(--text2);border-left:3px solid var(--purple);padding-left:12px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:2px;background:var(--border)}
.path-item{display:flex;gap:16px;padding:12px 8px 12px 0;text-decoration:none;color:var(--text);border-radius:6px;position:relative}
.path-item:hover{color:var(--text)}
.path-item:hover strong{color:var(--link);text-decoration:underline}
.path-num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;z-index:1}
.path-body{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.path-body>span{color:var(--text2);font-size:15px;max-width:66ch}
.path-body small{color:var(--text2);font-size:13px}

/* Module units */
.units{list-style:none;padding:0;margin:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.units li+li{border-top:1px solid var(--border)}
.units a{display:flex;gap:14px;padding:14px 18px;text-decoration:none;color:var(--text)}
.units a:hover{background:var(--bg2);color:var(--text)}
.units a:hover strong{color:var(--link)}
.units a>span:last-child{display:flex;flex-direction:column}
.units small{color:var(--text2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u-n{flex:none;width:36px;color:var(--text2);font-weight:600;font-size:14px;padding-top:2px}
.u-n.ic{color:var(--accent)}

/* Lesson boxes */
.box{border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin:0 0 16px;background:var(--bg)}
.box h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:1.1rem}
.box h2 svg{color:var(--accent)}
.box.obj{background:var(--accent-bg);border-color:transparent}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.checks li svg{flex:none;margin-top:5px;color:var(--ok)}
.notions{margin:0;padding-left:20px}
.notions li{padding:2px 0}
.notions li::marker{color:var(--accent)}
.res-list{list-style:none;padding:0;margin:0}
.res{display:flex;gap:12px;align-items:baseline;padding:6px 0;flex-wrap:wrap}
.res+.res{border-top:1px dashed var(--border)}
.badge{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;width:132px;justify-content:flex-start}
.badge.video{background:var(--reza-bg);color:var(--reza)}
.badge.learn{background:var(--accent-bg);color:var(--accent)}
.badge.article,.badge.wiki{background:var(--bg3);color:var(--text2)}
.badge.cherche{background:var(--warn-bg);color:var(--warn)}
.res{flex-wrap:nowrap}
.res>a,.res-q{flex:1;min-width:0}
@media (max-width:560px){.res{flex-wrap:wrap}.res>a,.res-q{flex-basis:100%}}
.res-q q{font-weight:600}
.res-q small{display:block;color:var(--text2);font-size:13px}

/* Cours */
.cours-box{padding-bottom:10px}
.cours h3{font-size:1.05rem;margin:22px 0 6px;font-weight:600}
.cours h3:first-child{margin-top:4px}
.cours p{margin:0 0 12px;max-width:72ch}
.cours .c-list{margin:0 0 12px;padding-left:22px;max-width:72ch}
.cours .c-list li{padding:2px 0}
.cours .c-list li::marker{color:var(--accent)}
.cours code,.res code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:.9em;background:var(--bg3);padding:1px 5px;border-radius:3px}
.code{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin:0 0 14px;overflow-x:auto;font-size:14px;line-height:1.5}
.code code{background:none;padding:0;font-size:inherit;white-space:pre}
.call{border-left:3px solid;border-radius:0 6px 6px 0;padding:10px 14px;margin:0 0 14px;max-width:72ch}
.call strong{display:block;font-size:13px;margin-bottom:2px}
.call p{margin:0}
.call.tip{background:var(--accent-bg);border-color:var(--accent)}
.call.tip strong{color:var(--accent)}
.call.warn{background:var(--warn-bg);border-color:var(--warn)}
.call.warn strong{color:var(--warn)}
.call.ex{background:var(--bg2);border-color:var(--purple)}
.call.ex strong{color:var(--purple)}
.more{margin:12px 0 0;font-size:14px;color:var(--text2)}

/* Exercises */
.ex h2{flex-direction:column;align-items:flex-start;gap:0}
.ex-n{font-size:13px;color:var(--purple);font-weight:600}
.ex p{margin:0 0 10px}
.livrable{background:var(--bg2);padding:10px 12px;border-radius:4px;font-size:15px}
.hint{background:var(--warn-bg);color:var(--text);border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 4px 4px 0;margin-top:8px;font-size:15px}

/* Pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:36px}
.pg{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;padding:10px 14px;text-decoration:none;font-weight:600;color:var(--link)}
.pg small{color:var(--text2);font-weight:400;font-size:13px}
.pg:hover{border-color:var(--accent)}
.pg.next{text-align:right;grid-column:2}

/* Quiz */
.quiz{list-style:none;padding:0;margin:0}
.q{border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:14px}
.q.ok{border-color:var(--ok)}
.q.ko{border-color:var(--ko)}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q legend{font-weight:600;margin-bottom:10px;padding:0;display:flex;flex-direction:column}
.qn{font-size:13px;color:var(--text2);font-weight:400}
.opt{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;cursor:pointer}
.opt:hover{background:var(--bg2)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--ko);background:var(--ko-bg)}
.opt input{accent-color:var(--accent);margin:0;flex:none}
.opt .mark{margin-left:auto;display:flex}
.opt.right .mark{color:var(--ok)}
.opt.wrong .mark{color:var(--ko)}
fieldset:disabled .opt{cursor:default}
fieldset:disabled .opt:hover{background:inherit}
.expl{margin:8px 0 0;font-size:15px;color:var(--text2)}
.q.ok .expl strong{color:var(--ok)}
.q.ko .expl strong{color:var(--ko)}
.quiz-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.score{display:flex;gap:20px;align-items:center;border-radius:8px;padding:16px 22px;margin-bottom:24px;border:1px solid}
.score.good{background:var(--ok-bg);border-color:var(--ok)}
.score.mid{background:var(--warn-bg);border-color:var(--warn)}
.score.low{background:var(--ko-bg);border-color:var(--ko)}
.score p{margin:2px 0 0;font-size:15px}
.score-num{font-size:2.6rem;font-weight:700;line-height:1}
.score-num span{font-size:1.2rem;color:var(--text2);font-weight:600}

/* Glossary */
.g-tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--border);margin-bottom:8px}
.g-filter{width:100%;max-width:360px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg)}
.g-filter:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.letters{display:flex;flex-wrap:wrap;gap:2px;margin-top:8px}
.letters a{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:4px;text-decoration:none;font-weight:600;font-size:14px}
.letters a:hover{background:var(--accent-bg)}
.g-group{scroll-margin-top:170px}
.g-letter{font-size:1.5rem;color:var(--accent);margin:24px 0 4px}
.g-group dl{margin:0}
.g-item{padding:10px 12px;border-radius:4px;scroll-margin-top:180px}
.g-item+.g-item{border-top:1px solid var(--border)}
.g-item.hl{background:var(--warn-bg)}
.g-item dt{font-weight:600}
.g-item dd{margin:2px 0 0;color:var(--text2)}

/* Responsive */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:0;bottom:0;width:min(320px,86vw);z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .toc{position:static;max-height:100%;height:100%}
  .scrim{display:block;position:fixed;inset:0;top:54px;background:rgba(0,0,0,.35);z-index:35}
  .page{padding:20px 18px 60px}
  .brand-t{display:none}
  .hero h1{font-size:2rem}
  h1{font-size:1.6rem}
}
@media (max-width:560px){
  .top{padding:0 10px;gap:8px}
  .pager{grid-template-columns:1fr}
  .pg.next{grid-column:1}
  .badge{width:auto}
  .search-item .kind{width:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

(()=>{var n=(e,t)=>({t:"learn",label:e,url:"https://learn.microsoft.com/fr-fr/"+t}),u=(e,t)=>({t:"article",label:e,url:t}),g=(e,t)=>({t:"wiki",label:e,url:"https://fr.wikipedia.org/wiki/"+t}),E=(e,t)=>({t:"video",label:e,url:t}),p=(e,t,r)=>({t:"cherche",plateforme:e,requete:t,conseil:r}),x={reza:E("Chaîne YouTube de Reza Dorrani (Power Apps, Power Automate, en anglais)","https://www.youtube.com/@RezaDorrani"),shane:E("Chaîne YouTube de Shane Young (Power Apps 911, en anglais)","https://www.youtube.com/@ShanesCows"),april:E("Chaîne YouTube d'April Dunnam (Power Platform, en anglais)","https://www.youtube.com/@AprilDunnam")},P={standards:u("Matthew Devaney : Power Apps Coding Standards for Canvas Apps","https://www.matthewdevaney.com/power-apps-coding-standards-for-canvas-apps/"),nommage:u("Matthew Devaney : Power Apps Naming Conventions for Canvas Apps","https://www.matthewdevaney.com/power-apps-naming-conventions-for-canvas-apps/"),patch:u("Matthew Devaney : exemples de Patch pour chaque type de colonne SharePoint","https://www.matthewdevaney.com/power-apps-patch-function-examples-for-every-sharepoint-column-type/"),delegation:u("Matthew Devaney : SharePoint Delegation Cheat Sheet for Power Apps","https://www.matthewdevaney.com/sharepoint-delegation-cheat-sheet-for-power-apps/"),conteneurs:u("Matthew Devaney : A Visual Guide to Power Apps Containers","https://www.matthewdevaney.com/a-visual-guide-to-power-apps-containers/"),formulaires:u("Matthew Devaney : 10 Things You Should Know About Power Apps Forms","https://www.matthewdevaney.com/10-things-you-should-know-about-power-apps-forms/"),galerie:u("Matthew Devaney : 5 Power Apps Gallery Design UX Tips","https://www.matthewdevaney.com/5-power-apps-gallery-design-ux-tips"),erreursFlux:u("Matthew Devaney : Power Automate Standards, Error-Handling","https://www.matthewdevaney.com/power-automate-standards-error-handling/"),parseJson:u("Matthew Devaney : renvoyer une collection d'un flux vers Power Apps avec ParseJSON","https://www.matthewdevaney.com/return-a-collection-from-a-flow-to-power-apps-with-parsejson/")};var U={id:"m0",num:0,title:"Bien démarrer",intro:"Avant d'ouvrir l'outil, on pose le décor : ce qu'est la Power Platform, comment obtenir un espace de travail gratuit pour s'entraîner, et comment apprendre efficacement en autonomie.",lessons:[{id:"l0-1",title:"Qu'est-ce que la Power Platform ?",intro:"La Power Platform est la suite « low-code » de Microsoft. Elle permet de créer des applications, d'automatiser des tâches, d'analyser des données et de créer des agents conversationnels sans être développeur professionnel.",objectifs:["Citer les composants de la Power Platform et leur rôle","Expliquer ce que signifie « low-code »","Identifier un cas d'usage pour Power Apps, Power Automate, Power BI et Copilot Studio"],contenu:["## Le low-code, en clair","Développer une application « classique » demande d'écrire des milliers de lignes de code dans un langage comme Java, C# ou JavaScript. Le low-code remplace l'essentiel de ce travail par des éléments visuels que l'on glisse sur un écran et par des formules proches de celles d'Excel. On écrit donc très peu de code, d'où le nom.","L'intérêt est double : les personnes qui connaissent le métier (RH, logistique, finance…) peuvent construire elles-mêmes les outils dont elles ont besoin, et les équipes informatiques gagnent du temps sur les petits besoins. Ces créateurs sont souvent appelés « citizen developers ».","## Les briques de la plateforme","- **Power Apps** : créer des applications web et mobiles (saisie de demandes, inventaire, suivi de visites…).","- **Power Automate** : automatiser des processus. Exemple : quand un formulaire est envoyé, prévenir un responsable par e-mail et enregistrer la réponse.","- **Power BI** : transformer des données en tableaux de bord et rapports interactifs.","- **Copilot Studio** : créer des agents conversationnels (chatbots) capables de répondre à des questions ou d'exécuter des actions.","- **Dataverse** : la base de données commune, sécurisée, sur laquelle ces outils peuvent s'appuyer.","- **Connecteurs** : plus d'un millier de passerelles prêtes à l'emploi vers Outlook, SharePoint, Teams, Excel, SQL Server, Salesforce, etc.","## Comment les briques travaillent ensemble","Prenons une demande de congés. L'employé saisit sa demande dans une **application Power Apps**. Les données sont stockées dans **Dataverse** ou une liste **SharePoint**. Un **flux Power Automate** envoie la demande au manager pour approbation. Un rapport **Power BI** montre ensuite aux RH les absences par service. Chaque outil fait une chose, et ensemble ils couvrent tout le processus.",{astuce:"Ce parcours se concentre sur Power Apps et Power Automate, qui sont le cœur de la création d'applications métier. Power BI et Copilot Studio sont présentés pour que vous sachiez quand les utiliser."}],notions:["Low-code : construire avec des éléments visuels et des formules","Power Apps, Power Automate, Power BI, Copilot Studio, Dataverse","Connecteur : passerelle vers un autre service","Les outils se combinent pour couvrir un processus de bout en bout"],ressources:[n("Présentation de Power Apps","power-apps/powerapps-overview"),n("Module de formation : Découvrir la valeur commerciale de Microsoft Power Platform","training/modules/introduction-power-platform/"),n("Certification PL-900 : Notions fondamentales de Power Platform","credentials/certifications/power-platform-fundamentals/"),p("YouTube","Power Platform explained for beginners","Regardez une vidéo récente (moins de 2 ans) qui fait le tour des outils.")],recherche:"Power Platform overview, low-code, PL-900"},{id:"l0-2",title:"Licences, environnements et plan Développeur",intro:"Pour pratiquer sans risque, il faut un espace personnel. Le plan Développeur Power Apps offre gratuitement un environnement d'entraînement, avec Dataverse et les connecteurs premium.",objectifs:["Comprendre ce qu'est un environnement","Distinguer connecteurs standard et premium","Créer son environnement Développeur"],contenu:["## Tenant et environnements","Votre organisation dispose d'un **tenant** Microsoft 365 : c'est son espace global chez Microsoft, avec ses utilisateurs et ses licences. À l'intérieur, la Power Platform est découpée en **environnements**. Un environnement est un conteneur isolé qui regroupe des applications, des flux, des données et des règles de sécurité.","On sépare généralement les environnements par usage : un environnement de **développement** pour construire, un de **test** pour valider, un de **production** pour les utilisateurs réels. Chaque tenant a aussi un environnement « par défaut », partagé par tout le monde : évitez d'y construire des choses importantes.","## Standard ou premium : la question des licences","Avec la plupart des abonnements Microsoft 365, vous pouvez déjà créer des applications et des flux qui utilisent des **connecteurs standard** : SharePoint, Outlook, Teams, Excel sur OneDrive…","Certains connecteurs sont **premium** : Dataverse, SQL Server, HTTP, Salesforce, etc. Pour qu'un utilisateur se serve d'une application qui les utilise, il lui faut une licence Power Apps payante. C'est un critère de choix important dès la conception, car il change le coût du projet.",{attention:"Les offres et les prix de licence changent régulièrement. Vérifiez toujours la page officielle des licences avant de proposer une solution à votre organisation."},"## Le plan Développeur","Le plan Développeur Power Apps est gratuit. Il vous donne un environnement personnel avec Dataverse et l'accès aux connecteurs premium, uniquement pour apprendre et tester. Il ne permet pas de mettre une application en production pour d'autres utilisateurs.","Pour l'obtenir, inscrivez-vous avec votre adresse professionnelle ou scolaire, puis vérifiez dans make.powerapps.com que l'environnement apparaît dans le sélecteur d'environnement (en haut à droite)."],notions:["Tenant : l'organisation Microsoft 365","Environnement : conteneur isolé (dev, test, prod)","Connecteur standard vs premium","Plan Développeur : gratuit, pour apprendre uniquement"],ressources:[n("Guide du plan Développeur Power Apps","power-platform/developer/plan"),n("Vue d'ensemble des environnements Power Platform","power-platform/admin/environments-overview"),n("Vue d'ensemble des licences Power Platform","power-platform/admin/pricing-billing-skus"),p("YouTube","Power Apps Developer Plan setup","Pour voir l'inscription pas à pas.")],recherche:"Power Apps developer plan, connecteur premium, environnement Power Platform"},{id:"l0-3",title:"Apprendre en autonomie et rester à jour",intro:"La Power Platform évolue chaque mois. Savoir chercher l'information récente et repérer un tutoriel obsolète fait partie des compétences d'un bon créateur.",objectifs:["Savoir où chercher une réponse fiable","Repérer si un tutoriel est obsolète","Mettre en place une routine de veille"],contenu:["## Trois types de sources","- **La documentation officielle** (Microsoft Learn) : fiable et à jour, mais parfois aride. C'est la référence pour vérifier la syntaxe d'une fonction ou une limite.","- **Les créateurs de contenu** (vidéos, blogs) : très concrets, avec des cas réels. Ils sont plus agréables pour apprendre mais peuvent dater.","- **La communauté** (forum Power Platform) : idéale quand vous êtes bloqué sur un problème précis. Quelqu'un a souvent déjà posé la même question.","## Repérer un contenu obsolète","L'interface de Power Apps a beaucoup changé ces dernières années (nouveau concepteur de flux, contrôles modernes, Copilot…). Avant de suivre un tutoriel, regardez sa date. Si les écrans ne ressemblent pas aux vôtres, cherchez la même chose dans la documentation ou dans une vidéo plus récente. Les concepts (délégation, variables, Patch) restent valables bien plus longtemps que l'emplacement des boutons.","## Bien chercher","Le contenu en anglais est beaucoup plus abondant. Une bonne méthode : chercher en anglais avec des mots-clés précis (par exemple « Power Apps Patch choice column »), puis vérifier le détail en français sur Microsoft Learn. Ajoutez l'année à votre recherche pour favoriser les résultats récents. Sur YouTube, la traduction automatique des sous-titres en français aide beaucoup.","## Tenir un journal d'apprentissage","Notez chaque formule utile, chaque erreur rencontrée et sa solution. Au bout de quelques semaines, ce journal devient votre aide-mémoire personnel, bien plus efficace qu'une recherche répétée.",{astuce:"Les plans de publication (release plans) annoncent les nouveautés des six mois à venir. Les parcourir une fois par saison suffit pour rester à jour."}],notions:["Documentation officielle, créateurs de contenu, communauté","Vérifier la date et l'interface d'un tutoriel","Chercher en anglais, vérifier en français","Tenir un journal d'apprentissage"],ressources:[u("Forum de la communauté Power Platform","https://community.powerplatform.com/"),n("Plans de publication Power Platform (nouveautés à venir)","power-platform/release-plan/"),u("Blog officiel Power Platform (en anglais)","https://www.microsoft.com/en-us/power-platform/blog/"),x.reza,x.shane,x.april],recherche:"Power Platform release wave, what's new Power Apps"}],exercices:[{titre:"Créer son environnement",enonce:"Inscrivez-vous au plan Développeur Power Apps et vérifiez que votre environnement apparaît dans le sélecteur d'environnement en haut à droite de make.powerapps.com.",livrable:"Une capture d'écran de votre environnement Développeur.",indice:"Si votre organisation bloque l'inscription, demandez à votre administrateur, ou créez un tenant de test via le programme développeur Microsoft 365."},{titre:"Cartographier des usages",enonce:"Listez 3 tâches répétitives de votre quotidien (travail ou personnel). Pour chacune, indiquez quel outil de la Power Platform serait le plus adapté et pourquoi.",livrable:"Un tableau à 3 lignes : tâche, outil, justification."},{titre:"Préparer sa veille",enonce:"Abonnez-vous à deux chaînes vidéo et au blog officiel. Créez votre journal d'apprentissage (document, OneNote ou carnet) avec trois rubriques : formules, erreurs rencontrées, idées.",livrable:"Un journal d'apprentissage prêt à l'emploi."}],quiz:[{q:"Quel outil de la Power Platform sert principalement à automatiser des processus ?",options:["Power BI","Power Automate","Power Apps","Dataverse"],a:1,e:"Power Automate exécute des flux : un déclencheur puis des actions, sans intervention humaine."},{q:"Qu'est-ce qu'un environnement ?",options:["Un type d'application","Un conteneur isolé qui regroupe apps, flux et données","Un connecteur premium","Une licence"],a:1,e:"Les environnements séparent les ressources (développement, test, production…)."},{q:"À quoi sert le plan Développeur ?",options:["Publier des apps en production","Disposer d'un environnement gratuit pour apprendre et tester","Obtenir des connecteurs premium pour toute l'entreprise","Remplacer Microsoft 365"],a:1,e:"C'est un environnement personnel d'entraînement, pas de production."},{q:"Une application utilise le connecteur Dataverse. Qu'est-ce que cela implique ?",options:["Rien de particulier","Les utilisateurs ont besoin d'une licence premium","Elle ne fonctionne que sur mobile","Elle ne peut pas être partagée"],a:1,e:"Dataverse est un connecteur premium : son usage relève des licences Power Apps payantes."},{q:"Quel est le meilleur réflexe face à un tutoriel vidéo ?",options:["Le suivre aveuglément","Vérifier sa date et comparer avec l'interface actuelle","Ne regarder que les vidéos de plus de 3 ans","Ignorer la documentation officielle"],a:1,e:"L'interface évolue souvent : la date et la documentation officielle permettent de vérifier."}]},k={id:"m1",num:1,title:"Le cycle de vie du logiciel (SDLC)",intro:"Une bonne application commence sur papier, quel que soit l'outil qui servira à la construire. Ce module présente les étapes d'un projet logiciel, les grandes méthodes de travail, et les techniques pour analyser un besoin, modéliser des données et concevoir des écrans. Tout ce qui est vu ici s'applique aussi bien à Power Apps qu'à une application web ou mobile classique.",lessons:[{id:"l1-1",title:"Qu'est-ce que le cycle de vie du logiciel ?",intro:"Le SDLC (Software Development Life Cycle) décrit les étapes par lesquelles passe un logiciel, de l'idée jusqu'à son retrait. Le connaître évite le piège le plus courant : construire vite… la mauvaise application.",objectifs:["Nommer et ordonner les étapes du cycle de vie","Expliquer le livrable de chaque étape","Comprendre pourquoi une erreur coûte plus cher quand on la découvre tard"],contenu:["## Les étapes","Selon les auteurs, le découpage varie un peu, mais on retrouve toujours ces grandes phases :","- **Analyse des besoins** : comprendre le problème, les utilisateurs et ce qu'ils attendent. Livrable : un cahier des charges ou un ensemble de user stories.","- **Conception** : décider comment la solution sera organisée : modèle de données, écrans, architecture technique. Livrables : schémas, maquettes, choix techniques justifiés.","- **Réalisation (développement)** : construire le logiciel.","- **Tests** : vérifier que le logiciel fonctionne (pas de bug) et qu'il répond bien au besoin (c'est ce que l'utilisateur voulait).","- **Déploiement** : mettre le logiciel à disposition des utilisateurs, avec formation et communication.","- **Maintenance** : corriger les anomalies, adapter aux changements, ajouter des fonctionnalités. C'est souvent la phase la plus longue de la vie d'un logiciel.","## Pourquoi ne pas sauter d'étape ?","Une erreur de compréhension du besoin coûte quelques minutes à corriger sur papier, quelques heures si on la découvre pendant le développement, et beaucoup plus si elle est découverte après la mise en production (données à reprendre, utilisateurs à reformer, confiance perdue). Investir du temps dans l'analyse et la conception est donc rentable, même pour une petite application.","## Un vocabulaire utile","- **Partie prenante** : toute personne concernée par le projet (commanditaire, utilisateurs, équipe informatique…).","- **Périmètre** : ce que le projet inclut, et surtout ce qu'il n'inclut pas.","- **Livrable** : un résultat concret et vérifiable produit à une étape.","- **MVP** (produit minimum viable) : la plus petite version utile qu'on peut livrer pour apprendre des retours des utilisateurs.",{exemple:"Une équipe gère ses demandes de matériel par e-mail. Sans analyse, on construit un formulaire de saisie. Avec analyse, on découvre que le vrai problème est le suivi : personne ne sait où en est une demande. La solution utile n'est pas la même."}],notions:["Analyse, conception, réalisation, tests, déploiement, maintenance","Chaque étape produit un livrable","Une erreur coûte plus cher quand elle est découverte tard","Partie prenante, périmètre, MVP"],ressources:[g("Cycle de développement (logiciel)","Cycle_de_d%C3%A9veloppement_(logiciel)"),u("AWS : Qu'est-ce que le SDLC ? (en français)","https://aws.amazon.com/fr/what-is/sdlc/"),g("Produit minimum viable","Produit_minimum_viable"),p("YouTube","software development life cycle explained","Choisissez une vidéo généraliste, sans lien avec un outil particulier.")],recherche:"SDLC, cycle de vie du logiciel, MVP"},{id:"l1-2",title:"Les méthodes : cascade, cycle en V et agilité",intro:"Les étapes du cycle de vie peuvent s'enchaîner de différentes façons. On distingue les méthodes séquentielles, où chaque étape est terminée avant la suivante, et les méthodes agiles, où l'on avance par petites livraisons successives.",objectifs:["Décrire le modèle en cascade et le cycle en V","Expliquer les principes de l'agilité","Connaître le vocabulaire de base de Scrum et Kanban"],contenu:["## Le modèle en cascade","Les étapes se suivent dans l'ordre, comme l'eau qui descend une cascade : on termine entièrement l'analyse, puis toute la conception, puis tout le développement, etc. C'est simple à piloter et adapté quand le besoin est stable et bien connu. La faiblesse : les utilisateurs ne voient le résultat qu'à la fin, et un malentendu découvert tard coûte cher.","## Le cycle en V","C'est une variante de la cascade qui associe chaque étape de conception à une étape de test. La branche descendante du V va du besoin vers le détail technique ; la branche montante remonte par les tests. Par exemple, les tests d'acceptation vérifient le besoin exprimé au début, et les tests unitaires vérifient la conception détaillée. Il est très utilisé dans les secteurs réglementés (aéronautique, santé, industrie).","## Les méthodes agiles","En 2001, des développeurs ont publié le **Manifeste agile**. Il privilégie les individus et leurs interactions, un logiciel qui fonctionne, la collaboration avec le client et l'adaptation au changement. Concrètement, on livre une petite partie utile du logiciel toutes les une à quatre semaines, on recueille les retours, et on ajuste la suite.","**Scrum** est la méthode agile la plus répandue. Le travail est découpé en **sprints** (cycles courts de durée fixe). Le **Product Owner** gère la liste priorisée des besoins (le **backlog**), l'équipe de développement réalise, et le **Scrum Master** aide l'équipe à bien appliquer la méthode. Chaque sprint se termine par une démonstration et une rétrospective.","**Kanban** est plus souple : un tableau à colonnes (À faire, En cours, Terminé) rend le travail visible, et on limite le nombre de tâches en cours pour éviter de tout commencer sans rien finir.","## Laquelle choisir ?","Il n'y a pas de bonne réponse universelle. Pour une application métier construite par une petite équipe, une approche agile légère fonctionne très bien : livrer un MVP rapidement, le faire tester par quelques utilisateurs, puis enrichir. Un projet avec de fortes contraintes réglementaires ou contractuelles penchera vers un cycle plus séquentiel.",{astuce:"Même seul, vous pouvez travailler de manière agile : un tableau Kanban (papier, Planner, Trello…) et des itérations d'une semaine suffisent."}],notions:["Cascade : étapes successives, besoin stable","Cycle en V : chaque étape de conception a son étape de test","Agilité : livrer petit et souvent, s'adapter","Scrum : sprint, backlog, Product Owner, Scrum Master","Kanban : tableau visuel, limiter le travail en cours"],ressources:[u("Manifeste pour le développement Agile de logiciels (texte officiel en français)","https://agilemanifesto.org/iso/fr/manifesto.html"),u("Le Guide Scrum 2020 (PDF officiel en français)","https://scrumguides.org/docs/scrumguide/v2020/2020-Scrum-Guide-French.pdf"),g("Modèle en cascade","Mod%C3%A8le_en_cascade"),g("Cycle en V","Cycle_en_V"),u("Atlassian : Kanban dans la gestion de projet","https://www.atlassian.com/fr/agile/kanban")],recherche:"cascade vs agile, Scrum pour débutants, Kanban"},{id:"l1-3",title:"Analyser le besoin",intro:"L'analyse consiste à comprendre le problème réel : qui sont les utilisateurs, ce qu'ils font aujourd'hui, ce qui les gêne et ce qu'ils attendent. C'est l'étape la plus importante, et la plus souvent bâclée.",objectifs:["Mener un entretien de recueil de besoin","Décrire le processus actuel et le processus cible","Rédiger des user stories avec des critères d'acceptation et les prioriser"],contenu:["## Identifier les parties prenantes","Listez toutes les personnes concernées : le **commanditaire** (qui finance ou porte le projet), les **utilisateurs** (souvent plusieurs profils : demandeur, valideur, gestionnaire…), et ceux qui administreront ou maintiendront la solution. Chacun a des attentes différentes.","## Conduire un entretien","Préparez quelques questions ouvertes, et faites raconter plutôt que demander ce qu'il faut construire : « Racontez-moi la dernière fois que vous avez dû faire une demande de matériel. Qu'est-ce qui a été difficile ? ». Les utilisateurs décrivent souvent une solution (« il me faut un bouton… ») ; votre rôle est de remonter au problème. Observer quelqu'un travailler apporte aussi beaucoup.","Pour résumer un profil d'utilisateur, on peut créer un **persona** : un personnage fictif mais réaliste (nom, rôle, objectifs, frustrations) qui aide toute l'équipe à garder l'utilisateur en tête.","## Décrire le processus : as-is et to-be","Le processus **actuel** (as-is) décrit ce qui se passe aujourd'hui, étape par étape, avec ses problèmes. Le processus **cible** (to-be) décrit comment les choses se passeront avec la solution. La comparaison des deux montre exactement ce que le projet doit changer.","## Les user stories","Une user story exprime un besoin du point de vue de l'utilisateur, en une phrase : **« En tant que** [rôle], **je veux** [action] **afin de** [bénéfice] ».",{exemple:"En tant que demandeur, je veux suivre le statut de ma demande afin de ne pas relancer le service informatique par e-mail."},"Chaque story est accompagnée de **critères d'acceptation** : des conditions vérifiables qui disent quand la story est terminée. Par exemple : « Le statut est visible dans la liste de mes demandes » et « Je reçois un e-mail quand le statut change ».","## Prioriser avec MoSCoW","- **Must have** : indispensable, sans cela la solution n'a pas de sens.","- **Should have** : important, mais on peut livrer sans dans un premier temps.","- **Could have** : souhaitable si le temps le permet.","- **Won't have (this time)** : explicitement exclu de cette version.","## Exigences fonctionnelles et non fonctionnelles","Une exigence **fonctionnelle** décrit ce que le système fait (« enregistrer une demande »). Une exigence **non fonctionnelle** décrit comment il le fait : performance, sécurité, accessibilité, disponibilité, compatibilité mobile. Ces dernières sont souvent oubliées et causent de mauvaises surprises."],notions:["Parties prenantes et personas","Entretien : faire raconter, remonter au problème","Processus actuel (as-is) et cible (to-be)","User story + critères d'acceptation","Priorisation MoSCoW","Exigences fonctionnelles et non fonctionnelles"],ressources:[u("Atlassian : user stories avec exemples et modèle","https://www.atlassian.com/fr/agile/project-management/user-stories"),g("Récit utilisateur","R%C3%A9cit_utilisateur"),g("Méthode MoSCoW","M%C3%A9thode_MoSCoW"),g("Persona (ergonomie)","Persona_(ergonomie)"),u("Nielsen Norman Group : User Interviews 101 (en anglais)","https://www.nngroup.com/articles/user-interviews/")],recherche:"recueil des besoins, user story exemples, critères d'acceptation, MoSCoW"},{id:"l1-4",title:"Modéliser les données",intro:"Toute application manipule des données. Les organiser correctement dès le départ, en tables, colonnes et relations, évite la plupart des blocages plus tard, quel que soit l'outil ou la base de données utilisés.",objectifs:["Identifier les entités (tables) d'un besoin","Choisir le bon type pour chaque information","Représenter des relations un-à-plusieurs et plusieurs-à-plusieurs"],contenu:["## Trouver les entités","Relisez vos user stories et soulignez les noms : demande, matériel, employé, service… Ce sont des candidats pour devenir des **tables** (on dit aussi entités). Une table regroupe des éléments du même type ; chaque **ligne** (enregistrement) est un élément ; chaque **colonne** (attribut) est une information sur cet élément.","## Choisir les types de colonnes","- Texte court (un nom) ou texte long (une description)","- Nombre entier ou décimal, montant","- Date, ou date et heure","- Oui/Non (booléen)","- Choix dans une liste fixe (statut : Nouvelle, En cours, Terminée)","- Référence vers un élément d'une autre table (la demande concerne tel matériel)","Un type précis protège la qualité des données : une colonne Date n'acceptera jamais « mardi prochain ».","## Identifiant et relations","Chaque ligne doit avoir un **identifiant unique** (souvent un numéro attribué automatiquement). Les relations relient les tables grâce à ces identifiants :","- **Un-à-plusieurs (1:N)** : un employé peut faire plusieurs demandes, mais chaque demande appartient à un seul employé. On ajoute dans la table Demandes une colonne qui pointe vers l'employé.","- **Plusieurs-à-plusieurs (N:N)** : un projet mobilise plusieurs employés, et un employé travaille sur plusieurs projets. On crée une table intermédiaire (Affectations) qui contient une ligne par couple employé-projet.","## Éviter la redondance","Une même information ne doit être stockée qu'à un seul endroit. Si le nom du service est recopié dans chaque demande, il faudra modifier des centaines de lignes le jour où le service change de nom. On crée plutôt une table Services et on y fait référence. C'est l'idée de base de la **normalisation**.","## Dessiner le modèle","On représente le tout dans un **schéma entité-association** : une boîte par table avec ses colonnes, et des traits entre les tables avec la cardinalité (1, N). Un papier suffit ; des outils gratuits comme draw.io ou dbdiagram.io rendent le schéma plus propre et facile à partager.",{code:`Employés (ID, Nom, Email, ServiceID)
Services (ID, Nom)
Matériels (ID, Nom, Catégorie, Prix)
Demandes (ID, EmployéID, MatérielID, Date, Statut, Motif)

Services 1 ── N Employés 1 ── N Demandes N ── 1 Matériels`}],notions:["Table, ligne, colonne","Types de colonnes précis = données de qualité","Identifiant unique","Relations 1:N et N:N (table intermédiaire)","Normalisation : une information à un seul endroit","Schéma entité-association"],ressources:[g("Modèle entité-association","Mod%C3%A8le_entit%C3%A9-association"),g("Forme normale (bases de données relationnelles)","Forme_normale_(bases_de_donn%C3%A9es_relationnelles)"),u("dbdiagram.io : dessiner un modèle de données (gratuit)","https://dbdiagram.io/"),u("draw.io : outil gratuit de diagrammes","https://www.drawio.com/"),p("YouTube","modélisation base de données débutant MCD","En français, cherchez aussi « MCD Merise », la méthode de modélisation enseignée en France.")],recherche:"modélisation de données débutant, MCD, diagramme entité-association, normalisation"},{id:"l1-5",title:"Concevoir l'interface : parcours et maquettes",intro:"Une maquette (wireframe) montre l'organisation des écrans avant de construire quoi que ce soit. Elle se modifie en quelques minutes et permet de valider l'idée avec les utilisateurs.",objectifs:["Dessiner un parcours utilisateur","Réaliser une maquette basse fidélité","Faire valider une maquette et appliquer quelques règles d'ergonomie"],contenu:["## Le parcours utilisateur","Avant de dessiner un écran, décrivez le chemin que suit l'utilisateur pour accomplir sa tâche : « J'ouvre l'application → je vois mes demandes → je clique sur Nouvelle demande → je remplis le formulaire → je valide → je reviens à la liste et vois ma demande ». Chaque flèche correspond souvent à un écran ou à une action.","## Basse et haute fidélité","Une maquette **basse fidélité** est un croquis : des rectangles, des traits pour le texte, aucune couleur. Elle sert à discuter de l'organisation sans se perdre dans les détails visuels. Une maquette **haute fidélité** ressemble à l'application finale (couleurs, polices, icônes) ; elle vient plus tard, une fois la structure validée.","## Les écrans types","La plupart des applications métier reposent sur trois écrans : une **liste** (avec recherche et filtres), un **détail** (toutes les informations d'un élément) et un **formulaire** (création ou modification). Commencer par ce trio couvre l'essentiel des besoins.","## Quelques règles d'ergonomie","- Montrer à l'utilisateur où il en est (statut, message de confirmation).","- Utiliser les mots de l'utilisateur, pas le jargon technique.","- Rester cohérent : un même bouton au même endroit, avec le même libellé, sur tous les écrans.","- Prévenir les erreurs plutôt que les signaler : désactiver Envoyer tant qu'un champ obligatoire est vide.","- Mettre en avant l'action principale de l'écran.","Ces principes viennent des « 10 heuristiques d'utilisabilité » de Jakob Nielsen, une référence en ergonomie.","## Faire valider","Montrez la maquette à deux ou trois futurs utilisateurs et demandez-leur de « jouer » une tâche : « Vous voulez commander un écran, où cliquez-vous ? ». Observez sans aider. Chaque hésitation est une information précieuse, obtenue avant d'avoir construit quoi que ce soit."],notions:["Parcours utilisateur","Maquette basse fidélité puis haute fidélité","Trio liste, détail, formulaire","Heuristiques d'utilisabilité","Tester la maquette avec de vrais utilisateurs"],ressources:[g("Wireframe (design)","Wireframe_(design)"),u("Nielsen Norman Group : les 10 heuristiques d'utilisabilité (en anglais)","https://www.nngroup.com/articles/ten-usability-heuristics/"),u("Nielsen Norman Group : Wireflows, maquettes et parcours (en anglais)","https://www.nngroup.com/articles/wireflows/"),u("Excalidraw : tableau blanc gratuit pour maquetter","https://excalidraw.com/"),u("Balsamiq Academy : apprendre le wireframing (en anglais)","https://balsamiq.com/learn/")],recherche:"wireframe, user flow, heuristiques de Nielsen, test utilisateur"},{id:"l1-6",title:"Tester, déployer et maintenir",intro:"Une application n'est pas terminée quand elle « marche sur mon poste ». Il faut vérifier qu'elle répond au besoin, la mettre à disposition proprement, puis la faire vivre.",objectifs:["Distinguer les principaux types de tests","Écrire un cas de test à partir d'un critère d'acceptation","Préparer un déploiement et organiser la maintenance"],contenu:["## Les types de tests","- **Test unitaire** : vérifier un petit élément isolé (une formule, une règle de calcul).","- **Test d'intégration** : vérifier que les éléments fonctionnent ensemble (l'application enregistre bien dans la base, le flux d'e-mail se déclenche).","- **Test de non-régression** : vérifier qu'une modification n'a pas cassé ce qui fonctionnait avant.","- **Test d'acceptation (recette, UAT)** : les utilisateurs métier vérifient que l'application répond à leur besoin réel.","## Écrire un cas de test","Les critères d'acceptation de vos user stories se transforment directement en cas de test : une situation de départ, des actions, un résultat attendu.",{code:`Cas de test n°4 – Suivi du statut
Prérequis : une demande existe au statut « Nouvelle »
Actions   : le service IT passe le statut à « En cours »
Attendu   : le demandeur voit « En cours » dans sa liste
            et reçoit un e-mail de notification
Résultat  : OK / KO + remarque`},"Pensez aussi aux cas « anormaux » : champ vide, valeur très longue, utilisateur sans droits, perte de connexion.","## Déployer","Le déploiement ne se limite pas à « publier » : il faut préparer un environnement de production distinct, reprendre éventuellement des données existantes, former les utilisateurs (une page de guide suffit souvent), annoncer la date de mise en service et prévoir qui répondra aux questions les premiers jours.","## Maintenir","On distingue la maintenance **corrective** (corriger un bug), **adaptative** (s'adapter à un changement extérieur : nouvelle règle, nouvel outil) et **évolutive** (ajouter des fonctionnalités). Tenez une liste des demandes d'évolution, priorisez-la comme un backlog, et documentez chaque version livrée.",{astuce:"Désignez toujours un « propriétaire » de l'application : la personne qui décide des évolutions et que l'on contacte en cas de problème. Une application sans propriétaire finit abandonnée."}],notions:["Tests unitaires, d'intégration, de non-régression, d'acceptation","Cas de test : prérequis, actions, résultat attendu","Déploiement = environnement + données + formation + communication","Maintenance corrective, adaptative, évolutive","Un propriétaire par application"],ressources:[g("Test (informatique)","Test_(informatique)"),g("Test d'acceptation","Test_d%27acceptation"),g("Maintenance du logiciel","Maintenance_du_logiciel"),p("YouTube","types de tests logiciels expliqués","Ajoutez « ISTQB » pour trouver des contenus rigoureux sur le vocabulaire du test.")],recherche:"types de tests logiciels, plan de test, recette utilisateur, maintenance corrective évolutive"}],exercices:[{titre:"Étude de cas : demandes de matériel",enonce:"Une équipe gère les demandes de matériel informatique par e-mail et dans un fichier Excel. Les demandes se perdent et personne ne sait où elles en sont. Décrivez le processus actuel en 5 à 8 étapes, puis le processus cible avec une application.",livrable:"Deux listes d'étapes (as-is et to-be) et 3 problèmes que la solution résout."},{titre:"Rédiger des user stories",enonce:"Pour le même cas, rédigez au moins 6 user stories (demandeur, manager, service informatique) avec 2 critères d'acceptation chacune. Classez-les avec la méthode MoSCoW.",livrable:"Un tableau : rôle, user story, critères, priorité.",indice:"Exemple : « En tant que demandeur, je veux suivre le statut de ma demande afin de ne pas relancer par e-mail. »"},{titre:"Modèle de données",enonce:"Identifiez les tables nécessaires (par exemple Demandes, Matériels, Catégories, Employés). Pour chacune, listez colonnes et types. Dessinez les relations avec leur cardinalité.",livrable:"Un schéma entité-association (papier, draw.io ou dbdiagram.io)."},{titre:"Maquettes",enonce:"Dessinez 3 écrans en basse fidélité : liste des demandes, détail d'une demande, formulaire de création. Indiquez la navigation entre eux, puis faites tester la maquette par une personne de votre entourage.",livrable:"3 wireframes, un schéma de navigation et 3 remarques issues du test."},{titre:"Plan de test et cahier des charges",enonce:"Transformez 4 critères d'acceptation en cas de test. Rassemblez ensuite tout ce qui précède dans un document d'une page : contexte, utilisateurs, besoins prioritaires, données, maquettes, plan de test.",livrable:"Un mini cahier des charges que vous réutiliserez dans les modules suivants."}],quiz:[{q:"Quelle étape du cycle de vie vient juste après l'analyse ?",options:["Tests","Conception","Déploiement","Maintenance"],a:1,e:"On conçoit (données, écrans, architecture) avant de réaliser."},{q:"Quelle est la principale différence entre la cascade et l'agilité ?",options:["L'agilité n'a pas de tests","La cascade livre tout à la fin, l'agilité livre par petites itérations","La cascade est réservée aux applications mobiles","Il n'y a aucune différence"],a:1,e:"L'agilité livre souvent pour recueillir des retours et s'adapter."},{q:"Dans Scrum, qui gère la liste priorisée des besoins (backlog) ?",options:["Le Scrum Master","Le Product Owner","Le client final uniquement","Le testeur"],a:1,e:"Le Product Owner est responsable du backlog et de ses priorités."},{q:"Quelle est la forme classique d'une user story ?",options:["« L'application doit être bleue »","« En tant que… je veux… afin de… »","« Si… alors… sinon »","« Table, colonne, ligne »"],a:1,e:"Elle exprime un rôle, un besoin et un bénéfice."},{q:"Un client peut passer plusieurs commandes. Quelle relation ?",options:["Un-à-un","Un-à-plusieurs","Aucune relation","Plusieurs-à-plusieurs obligatoirement"],a:1,e:"Un client (1) → plusieurs commandes (N)."},{q:"Comment représenter une relation plusieurs-à-plusieurs ?",options:["Avec une table intermédiaire","En dupliquant les données","Avec une seule colonne texte","C'est impossible"],a:0,e:"La table intermédiaire contient une ligne par association."},{q:"Dans MoSCoW, que signifie « Won't » ?",options:["Indispensable","Souhaitable","Ne sera pas fait cette fois","À tester"],a:2,e:"Won't = hors périmètre pour cette version."},{q:"« L'application doit répondre en moins de 2 secondes » est une exigence…",options:["Fonctionnelle","Non fonctionnelle","Une user story","Un critère MoSCoW"],a:1,e:"Performance, sécurité et accessibilité sont des exigences non fonctionnelles."},{q:"Qui réalise le test d'acceptation (recette) ?",options:["Uniquement le développeur","Les utilisateurs métier","Personne","L'éditeur du logiciel"],a:1,e:"Ils vérifient que l'application répond à leur besoin réel."}]};var I={astuce:"Dans ce parcours, les formules sont écrites comme dans un Power Apps en français : les arguments sont séparés par « ; » et les formules enchaînées par « ;; ». La documentation Microsoft et les vidéos en anglais utilisent « , » et « ; ». C'est la même formule, seuls les séparateurs changent selon la langue."},R={id:"m2",num:2,title:"Power Apps Canvas : les fondamentaux",intro:"Premier contact avec Power Apps Studio. On choisit le bon type de solution, puis on construit des écrans, on affiche des données SharePoint et on crée des formulaires. Aucune connaissance en code n'est nécessaire : les formules ressemblent à celles d'Excel.",lessons:[{id:"l2-0",title:"Du besoin à la solution Power Platform",intro:"Avec votre analyse en main (module 1), il faut maintenant choisir la forme de la solution. Toutes les demandes ne justifient pas une application : parfois un flux, un rapport ou une simple liste suffisent.",objectifs:["Distinguer app canevas et app pilotée par modèle","Savoir quand un flux ou une liste suffisent","Justifier un choix à partir des exigences"],contenu:["## Les options possibles","- **Une simple liste partagée** (liste SharePoint ou Microsoft Lists) : si le besoin est juste de centraliser des informations, sans logique particulière.","- **Un flux Power Automate seul** : si rien ne doit être saisi à l'écran, par exemple archiver automatiquement les pièces jointes d'e-mails.","- **Une app canevas** : vous dessinez chaque écran librement, comme une diapositive. Idéal pour des applications mobiles, des écrans de saisie simples et agréables, des usages terrain.","- **Une app pilotée par modèle** : l'interface est générée à partir des tables Dataverse (vues, formulaires, tableaux de bord). Idéal pour le back-office, quand il y a beaucoup de données reliées et des règles de gestion.","- **Un rapport Power BI** : si le besoin est d'analyser des données plutôt que d'en saisir.","## Les critères de choix","Reprenez vos exigences : qui utilise la solution et sur quel appareil ? Quel volume de données ? Quelles règles de sécurité ? Quelles licences sont disponibles ? Une solution qui oblige à acheter des licences premium pour 500 personnes peut être refusée, même si elle est techniquement parfaite.",{exemple:"Pour les demandes de matériel : une app canevas pour les demandeurs (simple, utilisable sur téléphone), un flux pour les approbations et notifications, et plus tard éventuellement une app pilotée par modèle pour le service informatique."},"## Combiner plutôt que choisir","Les solutions réelles mélangent souvent plusieurs briques. Ce parcours suit justement ce chemin : app canevas (modules 2 à 4), données et app pilotée par modèle (module 5), flux (modules 6 et 7)."],notions:["Liste, flux, app canevas, app pilotée par modèle, rapport","Critères : utilisateurs, appareils, volume, sécurité, licences","Les solutions combinent souvent plusieurs briques"],ressources:[n("Présentation de Power Apps (types d'applications)","power-apps/powerapps-overview"),n("Vue d'ensemble des applications pilotées par modèle","power-apps/maker/model-driven-apps/model-driven-app-overview"),p("YouTube","canvas app vs model-driven app","Les chaînes de Shane Young et Reza Dorrani traitent souvent cette comparaison.")],recherche:"canvas app vs model-driven app, choisir une solution Power Platform"},{id:"l2-1",title:"Découvrir Power Apps Studio",intro:"Power Apps Studio est l'éditeur des applications canevas. On y trouve l'arborescence des écrans, la barre de formule, le volet des propriétés et la zone de dessin.",objectifs:["Créer une app canevas vide","Se repérer dans l'interface","Enregistrer, publier et partager une app"],contenu:["## Créer sa première application","Sur make.powerapps.com, choisissez **Créer** puis **Application vide** (application canevas vide). Choisissez le format **Tablette** (paysage) ou **Téléphone** (portrait). Le format tablette s'adapte mieux aux écrans d'ordinateur ; vous apprendrez au module 4 à rendre une application adaptée à toutes les tailles.","## Les zones de l'écran","- **L'arborescence** (à gauche) : la liste des écrans et de tous les contrôles qu'ils contiennent. C'est ici que l'on renomme et réorganise.","- **La barre de formule** (en haut) : on choisit une propriété dans la liste déroulante, puis on écrit sa valeur ou sa formule.","- **La zone de dessin** (au centre) : l'écran tel que l'utilisateur le verra.","- **Le volet des propriétés** (à droite) : les réglages courants (couleur, taille, police) sans écrire de formule.","- **Insérer** : le menu pour ajouter boutons, zones de texte, galeries, icônes…","## Tester l'application","Le bouton **Lecture** (ou la touche F5) lance l'aperçu : vous utilisez l'application comme un utilisateur. Échap pour revenir à l'édition. En mode édition, maintenez la touche **Alt** pour cliquer sur un bouton sans quitter l'éditeur.","## Enregistrer, publier, partager","**Enregistrer** crée une nouvelle version, visible seulement par vous. **Publier** rend cette version disponible pour les utilisateurs. **Partager** donne l'accès à des personnes ou des groupes ; pensez aussi à leur donner accès aux données (la liste SharePoint, par exemple), sinon l'application s'ouvrira vide pour eux.",{astuce:"Enregistrez souvent. L'historique des versions (dans les détails de l'application) permet de revenir à une version précédente en cas d'erreur."}],notions:["Arborescence, barre de formule, propriétés, zone de dessin","Aperçu avec F5, clic en édition avec Alt","Enregistrer ≠ publier","Partager l'app ET l'accès aux données","Historique des versions"],ressources:[n("Créer une application canevas vide depuis le début","power-apps/maker/canvas-apps/create-blank-app"),n("Comprendre Power Apps Studio","power-apps/maker/canvas-apps/power-apps-studio"),n("Partager une application canevas","power-apps/maker/canvas-apps/share-app"),n("Module de formation : Prise en main des applications canevas","training/modules/get-started-with-powerapps/"),p("YouTube","Power Apps beginner tutorial","Filtrez par date (cette année) pour avoir l'interface actuelle.")],recherche:"Power Apps Studio interface, publier une app canevas"},{id:"l2-2",title:"Écrans, contrôles et propriétés",intro:"Une application est faite d'écrans qui contiennent des contrôles : étiquettes, boutons, zones de texte… Chaque contrôle a des propriétés que l'on peut fixer ou calculer avec une formule.",objectifs:["Ajouter et configurer des contrôles","Comprendre qu'une propriété peut contenir une formule","Nommer ses contrôles proprement"],contenu:["## Les contrôles de base","- **Étiquette (Label)** : afficher du texte.","- **Bouton** : déclencher une action.","- **Zone de texte (Text input)** : saisir du texte.","- **Liste déroulante, zone de liste modifiable (Combo box)** : choisir une valeur.","- **Bascule (Toggle), case à cocher** : oui/non.","- **Sélecteur de date, image, icône**.","## Propriétés d'affichage et de comportement","Chaque contrôle possède des **propriétés d'affichage** (Text, Color, Fill, Visible, Width…) et des **propriétés de comportement**, qui commencent par « On » : OnSelect (au clic), OnChange (quand la valeur change), OnVisible (quand un écran s'affiche).","La grande idée de Power Apps : une propriété d'affichage peut contenir une **formule** qui se recalcule toute seule, comme une cellule Excel. Par exemple, la propriété Text d'une étiquette :",{code:'"Bonjour " & txtPrenom.Text'},"Dès que l'utilisateur tape son prénom dans la zone `txtPrenom`, l'étiquette se met à jour, sans bouton ni code supplémentaire.","## Rendre l'affichage dynamique","La propriété **Visible** accepte vrai ou faux. Pour n'afficher un bouton que si un champ est rempli :",{code:"Visible : !IsBlank(txtPrenom.Text)"},"La propriété **DisplayMode** (Edit, View, Disabled) permet de griser un bouton au lieu de le cacher, ce qui est souvent plus clair pour l'utilisateur.","## Nommer ses contrôles","Par défaut, Power Apps nomme les contrôles Label1, Button3, TextInput7… Au bout de vingt contrôles, les formules deviennent illisibles. Adoptez une convention dès le début : un préfixe pour le type et un nom explicite, par exemple `lblTitre`, `btnEnvoyer`, `txtPrenom`, `galDemandes`.",I],notions:["Contrôles : étiquette, bouton, zone de texte, liste, bascule…","Propriétés d'affichage vs de comportement (On…)","Une propriété peut être une formule recalculée automatiquement","Visible et DisplayMode","Convention de nommage : lblTitre, btnEnvoyer…"],ressources:[n("Contrôles et propriétés dans les applications canevas","power-apps/maker/canvas-apps/reference-properties"),P.nommage,x.shane],recherche:"Power Apps controls properties, naming conventions"},{id:"l2-3",title:"Premiers pas en Power Fx",intro:"Power Fx est le langage de formules de Power Apps. Comme Excel, il est déclaratif : on décrit le résultat voulu, et la valeur se met à jour automatiquement quand les données changent.",objectifs:["Écrire des formules simples","Concaténer du texte, calculer, manipuler des dates","Distinguer formules d'affichage et formules d'action"],contenu:["## Deux familles de formules","Les **formules déclaratives** décrivent une valeur : la couleur d'un texte, le contenu d'une étiquette, la liste affichée dans une galerie. Elles se recalculent toutes seules.","Les **formules de comportement** (dans OnSelect, OnChange…) décrivent des actions à exécuter : naviguer, enregistrer, envoyer. Elles ne s'exécutent que lorsque l'événement se produit. Plusieurs actions s'enchaînent avec `;;`.",{code:`// OnSelect d'un bouton : deux actions enchaînées
SubmitForm(frmDemande);;
Navigate(scrListe)`},"## Opérateurs","- Calcul : `+ - * /`","- Comparaison : `= <> < > <= >=`","- Concaténation de texte : `&`","- Logique : `&&` (et), `||` (ou), `!` (non)","## Fonctions utiles pour commencer",{code:`Upper(txtNom.Text)                     // MAJUSCULES
Len(txtCommentaire.Text)               // nombre de caractères
Today()                                // date du jour
DateAdd(Today(); 7; TimeUnit.Days)     // dans 7 jours
Text(Now(); "dd/mm/yyyy hh:mm")         // date formatée
Value(txtQuantite.Text) * 12,5         // texte → nombre, puis calcul
User().FullName                        // nom de l'utilisateur connecté`},"## Lire une erreur","Quand une formule est incorrecte, Power Apps souligne en rouge et affiche une icône d'erreur. Survolez-la : le message indique souvent précisément le problème (mauvais type, nom inconnu, parenthèse manquante). Les commentaires `//` aident à documenter une formule complexe.",I],notions:["Formules déclaratives vs de comportement","Enchaîner des actions avec ;;","Opérateurs : & pour le texte, && || ! pour la logique","Fonctions : Text, Today, DateAdd, Value, User()","Commentaires // dans les formules"],ressources:[n("Présentation de Microsoft Power Fx","power-platform/power-fx/overview"),n("Référence des formules (toutes les fonctions)","power-platform/power-fx/formula-reference"),n("Fonction Text (formater nombres et dates)","power-platform/power-fx/reference/function-text"),u("Power Fx sur GitHub : le langage est open source (en anglais)","https://github.com/microsoft/Power-Fx")],recherche:"Power Fx formulas, Power Apps Text function date format"},{id:"l2-4",title:"Les listes SharePoint comme source de données",intro:"SharePoint est une source de données incluse dans Microsoft 365, idéale pour débuter. On crée une liste, puis on la connecte à l'application.",objectifs:["Créer une liste SharePoint avec les bons types de colonnes","Connecter une liste à une app","Connaître les limites de SharePoint"],contenu:["## Créer la liste","Dans un site SharePoint (celui de votre équipe, par exemple), choisissez **Nouveau → Liste**. Chaque colonne correspond à une colonne de votre modèle de données du module 1. Choisissez les types avec soin :","- **Une ligne de texte** / **Plusieurs lignes de texte**","- **Nombre**, **Devise**, **Date et heure**, **Oui/Non**","- **Choix** : une liste fixe de valeurs (Statut : Nouvelle, En cours, Terminée)","- **Personne ou groupe** : un utilisateur de l'organisation","- **Recherche (lookup)** : une référence vers un élément d'une autre liste (c'est ainsi qu'on fait une relation 1:N)",{attention:"Le nom interne d'une colonne est fixé à sa création. Créez-la d'abord sans espaces ni accents (StatutDemande), puis renommez son libellé affiché si besoin. Sinon, Power Apps verra des noms comme « Statut_x0020_demande »."},"## Connecter la liste à l'application","Dans Power Apps Studio, ouvrez le volet **Données**, choisissez **Ajouter des données**, puis le connecteur **SharePoint**, votre site et votre liste. La liste devient une source utilisable dans les formules, sous son nom.","## Colonnes simples et colonnes complexes","Les colonnes texte, nombre et date se manipulent directement. Les colonnes Choix, Personne et Recherche sont des **colonnes complexes** : leur valeur est un enregistrement (avec par exemple une propriété Value ou DisplayName). C'est pour cela qu'on écrit `ThisItem.Statut.Value` pour afficher un choix. Elles demandent aussi plus de soin pour l'écriture (leçon Patch au module 3).","## Les limites à connaître","SharePoint gère bien quelques milliers d'éléments. Au-delà de **5 000 éléments**, les filtres doivent porter sur des colonnes **indexées**, et certaines formules ne sont plus fiables (voir la délégation au module 3). SharePoint gère aussi mal les relations complexes et la sécurité fine par ligne. Pour ces besoins, on passera à Dataverse (module 5)."],notions:["Liste, colonnes, éléments","Types : texte, nombre, date, choix, personne, recherche","Nom interne d'une colonne fixé à la création","Colonnes complexes : .Value, .DisplayName","Seuil de 5 000 éléments et colonnes indexées"],ressources:[n("Se connecter à SharePoint à partir d'une application canevas","power-apps/maker/canvas-apps/connections/connection-sharepoint-online"),p("support.microsoft.com","Créer une liste dans SharePoint","La page d'aide Microsoft explique la création d'une liste pas à pas."),p("YouTube","SharePoint list design for Power Apps","Reza Dorrani a plusieurs vidéos sur la bonne conception des listes.")],recherche:"SharePoint list Power Apps, colonne lookup, index SharePoint, nom interne de colonne"},{id:"l2-5",title:"Galeries : afficher une liste de données",intro:"La galerie affiche plusieurs enregistrements sous forme de liste ou de grille. C'est le contrôle central de la plupart des applications.",objectifs:["Ajouter une galerie liée à une source","Personnaliser le modèle d'élément","Récupérer l'élément sélectionné"],contenu:["## Le principe","Une galerie répète un **modèle** (la première ligne, que vous modifiez) pour chaque enregistrement de sa propriété **Items**. Ce que vous placez dans le modèle (étiquettes, icônes, images) apparaît sur chaque ligne avec les données de l'élément correspondant.",{code:"Items : Demandes"},"## ThisItem : l'élément de la ligne","Dans le modèle, `ThisItem` désigne l'enregistrement affiché sur la ligne. Une étiquette du modèle peut donc afficher :",{code:`ThisItem.Titre
ThisItem.Statut.Value              // colonne Choix
Text(ThisItem.Created; "dd/mm/yyyy")`},"## Selected : l'élément choisi","Quand l'utilisateur clique sur une ligne, l'enregistrement devient `galDemandes.Selected`. C'est ainsi qu'un écran de détail sait quoi afficher. Dans OnSelect de la galerie :",{code:"Navigate(scrDetail; ScreenTransition.Cover)"},"Puis, dans l'écran de détail, la propriété Item du formulaire vaut `galDemandes.Selected`.","## Mise en forme conditionnelle","Une formule dans la couleur d'un élément permet de rendre le statut lisible d'un coup d'œil :",{code:`Color : Switch(ThisItem.Statut.Value;
    "Nouvelle"; Color.RoyalBlue;
    "En cours"; Color.DarkOrange;
    "Terminée"; Color.Green;
    Color.Gray)`},{astuce:"Ne transmettez jamais une information par la couleur seule : ajoutez toujours le texte du statut, pour les personnes daltoniennes."}],notions:["Propriété Items = la source","ThisItem : l'enregistrement de la ligne","Galerie.Selected : l'élément cliqué","Galerie verticale, horizontale, à hauteur flexible","Mise en forme conditionnelle avec Switch ou If"],ressources:[n("Afficher une liste d'éléments (ajouter une galerie)","power-apps/maker/canvas-apps/add-gallery"),n("Référence du contrôle Galerie","power-apps/maker/canvas-apps/controls/control-gallery"),P.galerie],recherche:"Power Apps gallery ThisItem Selected, conditional formatting gallery"},{id:"l2-6",title:"Formulaires : créer, modifier, afficher",intro:"Les formulaires d'édition et d'affichage permettent de créer et modifier des enregistrements sans écrire la logique d'enregistrement vous-même.",objectifs:["Configurer un formulaire d'édition et d'affichage","Créer, modifier et enregistrer un élément","Gérer la réussite et l'échec d'un enregistrement"],contenu:["## Deux propriétés essentielles","Un formulaire a besoin de savoir **quelle table** il manipule (propriété **DataSource**) et **quel enregistrement** (propriété **Item**). Par exemple : DataSource = `Demandes`, Item = `galDemandes.Selected`.","Le formulaire contient une **carte** (DataCard) par colonne. Vous choisissez les champs affichés dans le volet de droite. Pour modifier une carte (changer un libellé, ajouter une règle), il faut parfois la **déverrouiller**.","## Les trois modes","Un même formulaire d'édition peut servir à créer, modifier ou consulter :",{code:`// Bouton « Nouvelle demande »
NewForm(frmDemande);; Navigate(scrFormulaire)

// Bouton « Modifier »
EditForm(frmDemande);; Navigate(scrFormulaire)

// Bouton « Enregistrer »
SubmitForm(frmDemande)

// Bouton « Annuler »
ResetForm(frmDemande);; Back()`},"## Réussite et échec","`SubmitForm` lance l'enregistrement, mais le résultat arrive ensuite. On place donc la suite dans les propriétés du formulaire :",{code:`OnSuccess : Notify("Demande enregistrée"; NotificationType.Success);; Back()
OnFailure : Notify("Erreur : " & frmDemande.Error; NotificationType.Error)`},"La propriété `frmDemande.LastSubmit` contient l'enregistrement tout juste créé, avec son identifiant. La propriété `frmDemande.Valid` indique si tous les champs obligatoires sont remplis : idéal pour désactiver le bouton Enregistrer."],notions:["Formulaire d'édition / d'affichage","DataSource (la table) et Item (l'enregistrement)","NewForm, EditForm, SubmitForm, ResetForm","OnSuccess / OnFailure plutôt qu'après SubmitForm","LastSubmit, Valid, cartes de données"],ressources:[n("Comprendre les formulaires d'application canevas","power-apps/maker/canvas-apps/working-with-forms"),P.formulaires,x.reza],recherche:"Power Apps SubmitForm OnSuccess, edit form tutorial"},{id:"l2-7",title:"Navigation entre écrans",intro:"Une application comporte généralement plusieurs écrans : liste, détail, formulaire. La fonction Navigate permet de passer de l'un à l'autre.",objectifs:["Naviguer entre écrans avec transitions","Revenir à l'écran précédent","Définir l'écran de démarrage"],contenu:["## Navigate et Back",{code:`Navigate(scrDetail)                               // aller à un écran
Navigate(scrDetail; ScreenTransition.Fade)        // avec une transition
Back()                                            // revenir à l'écran précédent`},"`Back()` ramène à l'écran d'où l'on vient, ce qui est plus fiable qu'un Navigate vers un écran fixe quand un même écran peut être atteint de plusieurs façons.","## Passer une information à l'écran suivant","Navigate accepte un troisième argument pour créer une variable propre à l'écran d'arrivée :",{code:"Navigate(scrDetail; ScreenTransition.None; {locDemande: ThisItem})"},"Dans scrDetail, `locDemande` contient l'enregistrement. On reverra les variables en détail au module 3.","## Écran de démarrage et OnVisible","La propriété **StartScreen** de l'objet App définit le premier écran affiché, éventuellement selon une condition (par exemple un écran différent pour les managers). La propriété **OnVisible** d'un écran s'exécute à chaque fois qu'il s'affiche : utile pour réinitialiser un formulaire ou rafraîchir des données.","## Organiser son application","Nommez les écrans clairement (`scrAccueil`, `scrListe`, `scrDetail`, `scrFormulaire`) et dessinez la navigation comme dans votre maquette du module 1. Une navigation prévisible rassure l'utilisateur."],notions:["Navigate(Écran; Transition)","Back()","Variable de contexte passée par Navigate","App.StartScreen","Écran.OnVisible"],ressources:[n("Fonctions Back et Navigate","power-platform/power-fx/reference/function-navigate"),n("Objet App (StartScreen, OnStart, Formulas)","power-platform/power-fx/reference/object-app")],recherche:"Power Apps Navigate Back StartScreen"}],exercices:[{titre:"Mini-projet : app de demandes de matériel (v1)",enonce:"En vous appuyant sur votre cahier des charges du module 1, créez une liste SharePoint « Demandes » et une app canevas avec : écran liste (galerie), écran détail (formulaire d'affichage), écran création/modification (formulaire d'édition).",livrable:"Une app fonctionnelle permettant de créer, consulter et modifier une demande.",indice:"Commencez par « Créer une app à partir de données » pour obtenir une base, puis reconstruisez-la vous-même à partir d'une app vide pour comprendre chaque élément."},{titre:"Mise en forme conditionnelle",enonce:"Dans la galerie, affichez le statut de la demande avec une couleur différente selon sa valeur (Nouvelle, En cours, Terminée), en gardant le texte du statut visible.",livrable:"Une galerie où la couleur reflète le statut."},{titre:"Messages et nommage",enonce:"Renommez tous les contrôles selon une convention, ajoutez une notification de succès et d'échec à l'enregistrement, et désactivez le bouton Enregistrer tant que le formulaire n'est pas valide.",livrable:"Une arborescence propre et un formulaire qui guide l'utilisateur."}],quiz:[{q:"Dans une galerie, comment fait-on référence à l'élément courant ?",options:["Gallery.Item","ThisItem","Self","Parent.Item"],a:1,e:"ThisItem désigne l'enregistrement affiché dans la ligne en cours."},{q:"Quelle fonction enregistre les données d'un formulaire d'édition ?",options:["SaveForm","SubmitForm","Navigate","Collect"],a:1,e:"SubmitForm(NomDuFormulaire) envoie les données vers la source."},{q:"Quelle propriété d'un formulaire indique quel enregistrement afficher ?",options:["DataSource","Item","Items","Default"],a:1,e:"DataSource = la table, Item = l'enregistrement."},{q:"Quel opérateur concatène du texte en Power Fx ?",options:["+","&","||","."],a:1,e:'"Bonjour " & txtNom.Text'},{q:"Quelle propriété se déclenche quand on clique sur un bouton ?",options:["OnChange","OnSelect","OnVisible","Text"],a:1,e:"OnSelect est la propriété de comportement du clic."},{q:"Comment afficher la valeur d'une colonne SharePoint de type Choix ?",options:["ThisItem.Statut","ThisItem.Statut.Value","Value(ThisItem.Statut)","ThisItem[Statut]"],a:1,e:"Une colonne Choix est un enregistrement : sa valeur est dans .Value."},{q:"Où placer la notification « Demande enregistrée » ?",options:["Juste après SubmitForm dans le bouton","Dans OnSuccess du formulaire","Dans OnVisible de l'écran","Dans Items de la galerie"],a:1,e:"OnSuccess ne s'exécute que si l'enregistrement a vraiment réussi."},{q:"Comment revenir à l'écran précédent ?",options:["Return()","Back()","Navigate(Previous)","Exit()"],a:1,e:"Back() ramène à l'écran d'où l'on vient."}]},O={id:"m3",num:3,title:"Power Fx et logique applicative",intro:"On passe d'une application qui affiche des données à une application qui raisonne : variables, conditions, filtres, écriture précise de données et gestion des erreurs.",lessons:[{id:"l3-1",title:"Variables et collections",intro:"Les variables mémorisent une valeur pendant l'utilisation de l'application. Les collections sont des tables temporaires stockées en mémoire.",objectifs:["Choisir le bon type de variable","Créer et manipuler une collection","Savoir quand utiliser (ou éviter) une variable"],contenu:["## Pourquoi des variables ?","Grâce aux formules déclaratives, on a souvent besoin de moins de variables qu'on ne le croit : une étiquette peut directement afficher `galDemandes.Selected.Titre`. Les variables servent quand il faut **mémoriser** quelque chose à un moment précis : l'utilisateur connecté au démarrage, le mode d'un écran, un panneau ouvert ou fermé.","## Les trois sortes de variables","- **Variable globale** avec `Set` : visible sur tous les écrans.","- **Variable de contexte** avec `UpdateContext` (ou Navigate) : visible sur un seul écran.","- **Collection** avec `Collect` / `ClearCollect` : une table en mémoire, sur tous les écrans.",{code:`Set(gblUtilisateur; User());;                       // globale
UpdateContext({locPanneauOuvert: true});;           // contexte
ClearCollect(colPanier; {Article: "Écran"; Qte: 1});; // collection
Collect(colPanier; {Article: "Clavier"; Qte: 2});;
Remove(colPanier; First(colPanier))`},"Ces fonctions s'utilisent dans des propriétés de comportement (OnSelect, OnVisible, OnStart…). Les préfixes `gbl`, `loc`, `col` permettent de savoir d'un coup d'œil à quoi on a affaire.","## OnStart et formules nommées","La propriété **App.OnStart** s'exécute au lancement de l'application. Elle a longtemps servi à tout initialiser, ce qui ralentissait le démarrage. Aujourd'hui, on préfère les **formules nommées** (propriété **App.Formulas**) pour les valeurs qui se calculent : elles sont évaluées seulement quand on en a besoin, et toujours à jour.",{code:`// App.Formulas (une formule nommée par ligne)
fxUtilisateur = User();;
