tion ou un flux ne peut pas mélanger des connecteurs de groupes différents. On empêche ainsi, par exemple, de copier automatiquement des données SharePoint vers un Dropbox personnel.","## Les outils","- Le **centre d'administration Power Platform** : environnements, capacité, stratégies, inventaire et analyses.","- Les **environnements gérés** : fonctionnalités de gouvernance supplémentaires (limitation du partage, rapports d'usage).","- Le **CoE Starter Kit** (Centre d'excellence) : un ensemble d'outils pour inventorier et piloter l'usage ; Microsoft intègre progressivement ses fonctionnalités dans le centre d'administration.","- **Power Platform Well-Architected** : un cadre de bonnes pratiques (fiabilité, sécurité, performance, expérience) pour concevoir des solutions solides.","## Documenter","Pour chaque application en production : un propriétaire et un suppléant, une documentation technique (sources de données, flux, sécurité, variables d'environnement), un guide utilisateur et une procédure de support."],notions:["Gouverner pour rendre la création sûre et durable","DLP : connecteurs professionnels, non professionnels, bloqués","Centre d'administration, environnements gérés, CoE Starter Kit","Well-Architected","Propriétaire, documentation, support"],ressources:[n("Stratégies de données (DLP)","power-platform/admin/wp-data-loss-prevention"),n("Considérations de sécurité et de gouvernance","power-platform/admin/governance-considerations"),n("CoE Starter Kit et sa transition vers le centre d'administration","power-platform/guidance/coe/starter-kit"),n("Well-Architected pour Power Platform","power-platform/well-architected/")],recherche:"Power Platform DLP policies, managed environments, CoE starter kit"},{id:"l8-7",title:"Copilot et Copilot Studio",intro:"L'IA est désormais intégrée à la plateforme : créer une application en décrivant le besoin, écrire des formules, ajouter un agent conversationnel. C'est le domaine qui évolue le plus vite : vérifiez toujours les nouveautés.",objectifs:["Utiliser Copilot pour créer et modifier une application","Découvrir Copilot Studio","Évaluer les limites et la fiabilité de l'IA"],contenu:["## Copilot pour construire","Dans Power Apps, on peut décrire une application en langage naturel (« une application pour suivre les demandes de matériel avec statut et approbateur ») : Copilot propose des tables et une première application. Dans le concepteur de formules, il explique une formule existante ou en suggère une. Dans Power Automate, il génère un flux à partir d'une description.","## Copilot pour les utilisateurs","On peut ajouter un contrôle Copilot dans une application pour que les utilisateurs posent des questions sur les données affichées.","## Copilot Studio","**Copilot Studio** permet de créer des **agents** : des assistants conversationnels qui répondent à partir de vos documents (sites SharePoint, fichiers), et qui peuvent agir en appelant des flux ou des connecteurs. Exemple : un agent dans Teams qui répond aux questions sur la politique de matériel et crée une demande à la fin de la conversation.","## AI Builder","**AI Builder** apporte des modèles d'IA prêts à l'emploi dans les applications et les flux : extraire les informations d'une facture, lire un document, classer un texte, ou appeler un modèle de langage avec un prompt personnalisé.","## Garder l'esprit critique","L'IA accélère le travail, mais elle se trompe. Relisez chaque formule générée, comprenez-la avant de l'utiliser, et testez-la. Les principes de ce parcours (analyser le besoin, modéliser les données, gérer la délégation, sécuriser la source) restent entièrement de votre responsabilité."],notions:["Créer une application ou un flux par description","Copilot dans l'éditeur de formules","Agents Copilot Studio","AI Builder : documents, classification, prompts","Relire, comprendre et tester ce que génère l'IA"],ressources:[n("Vue d'ensemble de Copilot dans Power Apps","power-apps/maker/canvas-apps/ai-overview"),n("Documentation Microsoft Copilot Studio","microsoft-copilot-studio/"),x.april,p("YouTube","Copilot Studio agent tutorial","Le sujet change tous les mois : limitez-vous aux vidéos très récentes.")],recherche:"Copilot Power Apps, Copilot Studio agents, AI Builder"},{id:"l8-8",title:"Pour aller plus loin",intro:"Pour les besoins non couverts par les connecteurs ou contrôles existants, la plateforme peut être étendue par du code. Ici, l'objectif est de savoir que cela existe et quand faire appel à un développeur.",objectifs:["Savoir ce qu'est un connecteur personnalisé","Savoir ce qu'est un composant PCF","Identifier quand faire appel à un développeur"],contenu:["## Les connecteurs personnalisés","Si un service possède une **API** (une interface de programmation accessible par le web) mais pas de connecteur, on peut créer un **connecteur personnalisé** en décrivant ses opérations (adresse, paramètres, authentification). Il s'utilise ensuite comme n'importe quel connecteur, dans les applications et les flux.","## Power Apps Component Framework (PCF)","Le **PCF** permet à des développeurs de créer des contrôles en code (TypeScript) : un calendrier avancé, une carte interactive, un graphique spécifique. Ces contrôles s'utilisent ensuite dans les applications comme les contrôles standard.","## Plug-ins et logique serveur","Dans Dataverse, des **plug-ins** (code C#) exécutent une logique complexe côté serveur quand une ligne est créée ou modifiée. Les **colonnes calculées en Power Fx** et les **fonctions Dataverse** couvrent désormais une partie de ces besoins sans code classique.","## Le développement « fusion »","Les meilleures solutions combinent les forces : les créateurs low-code construisent l'application et les processus, les développeurs fournissent les briques techniques (connecteurs, composants, intégrations). Savoir décrire précisément son besoin à un développeur est une compétence à part entière."],notions:["API et connecteur personnalisé","PCF : contrôles en code","Plug-ins Dataverse","Développement fusion créateurs + développeurs"],ressources:[n("Vue d'ensemble des connecteurs personnalisés","connectors/custom-connectors/"),n("Power Apps Component Framework","power-apps/developer/component-framework/overview"),p("YouTube","Power Apps custom connector tutorial","Cherchez un exemple avec une API publique gratuite pour vous exercer.")],recherche:"custom connector Power Apps, PCF component"}],exercices:[{titre:"Industrialiser son projet",enonce:"Placez toute votre application de demandes (application, flux, tables) dans une solution, avec variables d'environnement et références de connexion. Exportez-la en solution gérée.",livrable:"Un fichier de solution gérée importable dans un autre environnement.",indice:"Si vous n'avez qu'un environnement, créez-en un second avec le plan Développeur pour simuler la production."},{titre:"Plan de test",enonce:"Rédigez un plan de test à partir de vos user stories (module 1) : pour chaque critère d'acceptation, un cas de test avec résultat attendu. Exécutez-le et automatisez au moins un scénario avec Test Studio.",livrable:"Un plan de test avec le résultat de chaque cas."},{titre:"Optimisation",enonce:"Mesurez le temps de démarrage de votre application avec Monitor, appliquez 3 optimisations et mesurez à nouveau.",livrable:"Un avant/après avec les optimisations appliquées."}],quiz:[{q:"Quel type de solution déploie-t-on en production ?",options:["Non gérée","Gérée","Par défaut","Aucune"],a:1,e:"La solution gérée est verrouillée et propre à déployer."},{q:"À quoi sert une variable d'environnement ?",options:["Stocker une donnée utilisateur","Adapter une valeur (URL, e-mail…) selon l'environnement sans modifier l'application","Accélérer l'application","Remplacer Dataverse"],a:1,e:"Chaque environnement peut avoir sa propre valeur."},{q:"Quelle fonction exécute plusieurs formules en parallèle ?",options:["ForAll","Concurrent","Parallel","With"],a:1,e:"Concurrent() accélère notamment le chargement initial."},{q:"Quel outil permet de suivre en temps réel les appels d'une application ?",options:["Monitor","Test Studio","CoE","DLP"],a:0,e:"Monitor trace les formules et appels réseau."},{q:"Une stratégie DLP sert à…",options:["Sauvegarder les données","Définir quels connecteurs peuvent être utilisés ensemble","Déployer des solutions","Tester une application"],a:1,e:"Elle évite que des données sensibles sortent vers des services non autorisés."},{q:"Face à une formule générée par Copilot, il faut…",options:["L'utiliser telle quelle","La relire, la comprendre et la tester","La supprimer","Désactiver la délégation"],a:1,e:"L'IA accélère mais ne remplace pas la vérification."}]},G={id:"m9",num:9,title:"Projet final",intro:"Vous concevez et livrez seul une application complète en suivant tout le cycle de vie. Choisissez un vrai besoin, idéalement dans votre organisation.",lessons:[{id:"l9-1",title:"Analyse et conception",intro:"Appliquez le module 1 à un nouveau besoin réel. Cette fois, c'est vous qui menez tout de bout en bout.",objectifs:["Produire un cahier des charges complet","Concevoir le modèle de données et les maquettes","Choisir et justifier l'architecture"],contenu:["## Choisir un bon sujet","Un bon projet final est **réel** (quelqu'un en a vraiment besoin), **limité** (réalisable en quelques semaines) et **complet** (il fait intervenir des données, une application et au moins un flux). Exemples : réservation de salles ou de véhicules, suivi des formations, inventaire de matériel, gestion des notes de frais, registre des visiteurs.","## Les étapes","1. Deux ou trois entretiens avec les futurs utilisateurs.","2. Processus actuel et cible, personas.","3. User stories avec critères d'acceptation, priorisées avec MoSCoW. Définissez votre **MVP** : uniquement les « Must ».","4. Modèle de données (schéma entité-association).","5. Maquettes basse fidélité, testées avec un utilisateur.","6. Choix de la solution : type d'application, source de données, flux, licences nécessaires. Justifiez chaque choix en une phrase.",{astuce:"Faites valider le cahier des charges par la personne qui porte le besoin avant de construire. Une validation écrite, même par simple e-mail, évite bien des discussions plus tard."}],notions:["Un sujet réel, limité et complet","Entretiens, processus, personas","User stories et MVP","Modèle de données et maquettes testées","Choix d'architecture justifiés"],ressources:[u("Atlassian : user stories avec exemples et modèle","https://www.atlassian.com/fr/agile/project-management/user-stories"),u("dbdiagram.io : dessiner le modèle de données","https://dbdiagram.io/"),u("Excalidraw : maquetter rapidement","https://excalidraw.com/")],recherche:"modèle de cahier des charges, template user stories"},{id:"l9-2",title:"Réalisation",intro:"Construisez l'application et les flux dans une solution, par petites itérations, en faisant valider régulièrement.",objectifs:["Construire l'application et les flux dans une solution","Livrer une première version minimale (MVP)","Itérer selon les retours"],contenu:["## Organisation","Créez d'abord la solution, l'éditeur et les variables d'environnement. Tenez un tableau Kanban de vos user stories. Travaillez par itérations d'une semaine : à la fin de chacune, montrez ce qui fonctionne à un utilisateur et notez ses remarques.","## Qualité","- Conventions de nommage pour les écrans, contrôles, variables et actions de flux.","- Commentaires dans les formules complexes.","- Aucun avertissement de délégation non traité.","- Gestion des erreurs dans l'application et dans les flux.","- Vérificateur d'accessibilité sans erreur.","## Résister à la tentation","Les idées de fonctionnalités vont arriver en cours de route. Notez-les dans le backlog (« Could » ou « Won't this time ») et terminez d'abord le MVP. Une petite application terminée et utilisée vaut mieux qu'une grande application jamais livrée."],notions:["Solution et variables dès le départ","Itérations courtes avec démonstration","Checklist qualité : nommage, délégation, erreurs, accessibilité","Terminer le MVP avant d'ajouter"],ressources:[n("Directives de codage Power Apps","power-apps/guidance/coding-guidelines/overview"),P.standards,P.nommage],recherche:"Power Apps coding standards best practices"},{id:"l9-3",title:"Tests, déploiement et maintenance",intro:"Testez, faites valider par les utilisateurs, déployez en production, puis organisez le support et les évolutions.",objectifs:["Exécuter un plan de test et une recette utilisateur","Déployer en production","Rédiger la documentation et le plan de maintenance"],contenu:["## Tester","Exécutez votre plan de test complet dans l'environnement de test, avec un compte par rôle. Corrigez, puis faites réaliser la **recette** par deux ou trois utilisateurs. Leur accord écrit marque le feu vert.","## Déployer","Exportez la solution gérée, importez-la en production (ou utilisez un pipeline), renseignez les variables d'environnement et les connexions, partagez l'application avec les bons groupes, et vérifiez les droits sur les données. Annoncez la mise en service avec un guide d'une page.","## Documenter","- **Guide utilisateur** : à quoi sert l'application, comment faire les trois tâches principales, qui contacter.","- **Documentation technique** : schéma des données, liste des flux et de leurs déclencheurs, rôles de sécurité, variables d'environnement, licences nécessaires.","## Faire vivre","Mettez en place un moyen simple de recueillir les remarques (formulaire, canal Teams). Classez-les en corrections et évolutions, priorisez, et livrez de nouvelles versions régulièrement. Pour finir, faites une **rétrospective** : ce qui a bien marché, ce qui a été difficile, ce que vous feriez autrement."],notions:["Plan de test par rôle, puis recette","Déploiement : solution gérée, variables, partage, droits","Guide utilisateur et documentation technique","Recueil des retours et nouvelles versions","Rétrospective"],ressources:[n("ALM avec Microsoft Power Platform","power-platform/alm/"),n("Partager une application canevas","power-apps/maker/canvas-apps/share-app"),g("Maintenance du logiciel","Maintenance_du_logiciel")],recherche:"UAT checklist, Power Platform deployment checklist"}],exercices:[{titre:"Livrables du projet final",enonce:"Produisez : cahier des charges, modèle de données, maquettes, solution gérée (application + flux + tables), plan de test exécuté, guide utilisateur d'une page, documentation technique (sources, flux, sécurité, variables d'environnement).",livrable:"Un dossier complet et une démonstration de 10 minutes de votre application devant un public (collègues, manager, communauté)."},{titre:"Rétrospective",enonce:"Rédigez ce qui a bien fonctionné, ce qui a été difficile et ce que vous feriez autrement. Identifiez 3 sujets à approfondir.",livrable:"Une rétrospective d'une page et votre plan de progression personnel."}],quiz:[{q:"Qu'est-ce qu'un MVP ?",options:["Un type de licence","La plus petite version utile qu'on peut livrer et tester","Un composant PCF","Un rôle Dataverse"],a:1,e:"Minimum Viable Product : livrer vite pour apprendre des retours."},{q:"Qui réalise la recette utilisateur (UAT) ?",options:["Uniquement le développeur","Les utilisateurs métier","Microsoft","Personne"],a:1,e:"Ils vérifient que l'application répond à leur besoin réel."},{q:"Quand faut-il créer la solution ?",options:["À la fin, avant le déploiement","Dès le début du développement","Jamais","Après la mise en production"],a:1,e:"Travailler dans une solution dès le départ évite les oublis de composants."},{q:"Que faire d'une nouvelle idée de fonctionnalité en cours de réalisation ?",options:["L'ajouter immédiatement","La noter dans le backlog et terminer d'abord le MVP","L'oublier","Recommencer le projet"],a:1,e:"Le backlog garde l'idée sans faire dériver le projet."}]};var S=[U,k,R,O,F,V,Q,B,W,G],j=[["ALM","Application Lifecycle Management : gestion du cycle de vie d'une application, du développement au déploiement et à la maintenance."],["AI Builder","Fonctionnalités d'IA de la Power Platform (extraction de documents, prompts, classification)."],["App canevas","Application dont on dessine librement chaque écran et contrôle, compatible avec de nombreuses sources de données."],["App pilotée par modèle","Application générée à partir des tables Dataverse, avec formulaires et vues standardisés."],["Collection","Table temporaire stockée en mémoire dans une app canevas (Collect, ClearCollect)."],["Composant","Bloc d'interface réutilisable avec ses propres propriétés d'entrée et de sortie."],["Connecteur","Passerelle permettant à Power Apps ou Power Automate d'accéder à un service (SharePoint, Outlook, SQL…)."],["Connecteur premium","Connecteur nécessitant une licence Power Apps ou Power Automate payante (ex. Dataverse, SQL, HTTP)."],["Conteneur","Contrôle qui organise automatiquement d'autres contrôles horizontalement ou verticalement."],["Contrôle","Élément d'interface d'une app : bouton, étiquette, zone de texte, galerie…"],["Copilot Studio","Outil de création d'agents conversationnels (chatbots) intelligents."],["Critère d'acceptation","Condition vérifiable indiquant qu'une user story est correctement réalisée."],["Dataverse","Base de données relationnelle et sécurisée de la Power Platform."],["Déclencheur","Événement qui démarre un flux (nouvel élément, heure planifiée, clic…)."],["Délégation","Capacité de confier le filtrage et le tri à la source de données, pour traiter de gros volumes sans limite de lignes."],["DLP","Data Loss Prevention : stratégie définissant quels connecteurs peuvent être utilisés ensemble."],["Environnement","Espace isolé contenant apps, flux, données et paramètres de sécurité."],["Expression","Formule utilisée dans Power Automate pour transformer des données (formatDateTime, concat…)."],["Flux","Automatisation Power Automate composée d'un déclencheur et d'actions."],["Flux de bureau","Automatisation (RPA) qui simule les actions d'un utilisateur sur un ordinateur."],[
