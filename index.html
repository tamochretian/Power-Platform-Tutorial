fxEstManager = fxUtilisateur.Email in Managers.Email;;`},{attention:"Une collection est une copie des données en mémoire : elle n'est pas synchronisée automatiquement avec SharePoint. Utilisez-la pour des données temporaires (panier, filtres), pas comme remplacement de la source."}],notions:["Set : variable globale","UpdateContext : variable locale à l'écran","Collect, ClearCollect, Remove, Clear","App.OnStart vs App.Formulas (formules nommées)","Préfixes gbl, loc, col"],ressources:[n("Comprendre les variables des applications canevas","power-apps/maker/canvas-apps/working-with-variables"),n("Fonction Set","power-platform/power-fx/reference/function-set"),n("Fonctions Collect, Clear et ClearCollect","power-platform/power-fx/reference/function-clear-collect-clearcollect"),n("Objet App (OnStart et Formulas)","power-platform/power-fx/reference/object-app"),p("YouTube","Power Apps named formulas vs OnStart","Pour comprendre pourquoi les formules nommées remplacent peu à peu OnStart.")],recherche:"Set vs UpdateContext, named formulas Power Apps, collections"},{id:"l3-2",title:"Conditions : If et Switch",intro:"Les conditions permettent d'adapter le comportement et l'affichage : masquer un bouton, changer une couleur, refuser une saisie.",objectifs:["Écrire des conditions simples et imbriquées","Utiliser Switch pour plusieurs cas","Tester les valeurs vides"],contenu:["## If","`If(condition; valeur si vrai; valeur si faux)`. On peut enchaîner plusieurs conditions dans un seul If, sans imbriquer :",{code:`If(Value(txtMontant.Text) > 1000; "Validation direction";
   Value(txtMontant.Text) > 200;  "Validation manager";
   "Validation automatique")`},"## Switch","Quand on compare une même valeur à plusieurs possibilités, Switch est plus lisible :",{code:`Switch(drpPriorite.Selected.Value;
    "Haute"; Color.Red;
    "Moyenne"; Color.Orange;
    Color.Gray)        // valeur par défaut`},"## Combiner des conditions","`&&` (et), `||` (ou), `!` (non), ou les fonctions `And()`, `Or()`, `Not()`. Exemple : n'activer le bouton que si le titre est rempli et la quantité positive :",{code:`DisplayMode : If(!IsBlank(txtTitre.Text) && Value(txtQte.Text) > 0;
    DisplayMode.Edit; DisplayMode.Disabled)`},"## Valeurs vides","`IsBlank()` teste une valeur vide (champ non rempli, colonne sans valeur). `IsEmpty()` teste une table sans ligne (un filtre qui ne renvoie rien). `Coalesce()` renvoie la première valeur non vide, pratique pour une valeur par défaut."],notions:["If(condition; alors; sinon) avec plusieurs conditions","Switch(valeur; cas1; résultat1; …; défaut)","&&, ||, !","IsBlank, IsEmpty, Coalesce","DisplayMode conditionnel"],ressources:[n("Fonctions If et Switch","power-platform/power-fx/reference/function-if"),n("Fonctions Blank, Coalesce, IsBlank et IsEmpty","power-platform/power-fx/reference/function-isblank-isempty")],recherche:"Power Apps If Switch IsBlank Coalesce"},{id:"l3-3",title:"Rechercher et filtrer : Filter, Search, LookUp, Sort",intro:"Ces fonctions permettent d'afficher uniquement les données utiles : mes demandes, les demandes en cours, une recherche par mot-clé, triées par date.",objectifs:["Filtrer une galerie selon plusieurs critères","Retrouver un enregistrement unique","Trier les résultats"],contenu:["## Filter : plusieurs résultats",{code:'Filter(Demandes; Statut.Value = "En cours")'},"On peut cumuler les conditions, séparées par `;` (toutes doivent être vraies) :",{code:`Filter(Demandes;
    'Créé par'.Email = User().Email;
    Statut.Value = drpStatut.Selected.Value)`},"## Search : recherche par mot-clé",{code:"Search(Demandes; txtRecherche.Text; Titre; Description)"},"## LookUp : un seul résultat","LookUp renvoie le **premier** enregistrement qui correspond, ou une valeur vide. Idéal pour aller chercher une information dans une autre table :",{code:"LookUp(Matériels; ID = ThisItem.MaterielID).Prix"},"## Trier",{code:`Sort(Demandes; Created; SortOrder.Descending)
SortByColumns(Demandes; "Created"; SortOrder.Descending)`},"## Tout combiner","Les fonctions s'emboîtent : on filtre d'abord, puis on trie. C'est typiquement la propriété Items d'une galerie :",{code:`Sort(
    Filter(Demandes;
        StartsWith(Titre; txtRecherche.Text);
        drpStatut.Selected.Value = "Toutes" || Statut.Value = drpStatut.Selected.Value);
    Created; SortOrder.Descending)`},{astuce:"Sur SharePoint, StartsWith est délégable alors que Search ne l'est pas. Sur de grandes listes, préférez StartsWith (leçon suivante)."}],notions:["Filter : plusieurs résultats","Search : mot-clé dans plusieurs colonnes","LookUp : un seul résultat","Sort, SortByColumns","User().Email pour l'utilisateur connecté","Filtrer d'abord, trier ensuite"],ressources:[n("Fonctions Filter, Search et LookUp","power-platform/power-fx/reference/function-filter-lookup"),n("Fonctions Sort et SortByColumns","power-platform/power-fx/reference/function-sort"),p("YouTube","Power Apps filter gallery multiple conditions dropdown","Les vidéos de Reza Dorrani sur les filtres de galerie sont très complètes.")],recherche:"Power Apps filter gallery multiple conditions, StartsWith vs Search"},{id:"l3-4",title:"Écrire des données avec Patch",intro:"Patch crée ou modifie un enregistrement sans formulaire. C'est indispensable pour les écrans personnalisés, les mises à jour en un clic ou l'écriture dans plusieurs tables.",objectifs:["Créer un enregistrement avec Patch","Modifier un enregistrement existant","Écrire dans les colonnes complexes (choix, personne, recherche)"],contenu:["## Créer","`Defaults(Source)` fournit un enregistrement vierge ; Patch le remplit et l'enregistre :",{code:`Patch(Demandes; Defaults(Demandes);
    {Titre: txtTitre.Text; Quantite: Value(txtQte.Text)})`},"## Modifier","On passe l'enregistrement existant à la place de Defaults. Seules les colonnes indiquées changent :",{code:`// Bouton « Marquer comme terminée » dans la galerie
Patch(Demandes; ThisItem; {Statut: {Value: "Terminée"}})`},"## Les colonnes complexes SharePoint",'- **Choix** : `{Value: "En cours"}`','- **Recherche (lookup)** : `{Id: 12; Value: "Écran 27 pouces"}`','- **Personne** : un enregistrement avec `Claims` (de la forme `"i:0#.f|membership|" & email`), `DisplayName`, `Email`…',"Le plus simple est souvent de reprendre la valeur sélectionnée dans une zone de liste modifiable reliée à la même colonne : `Statut: cmbStatut.Selected`.","## Récupérer le résultat","Patch renvoie l'enregistrement créé, avec son identifiant. On peut le mémoriser :",{code:`Set(gblNouvelle; Patch(Demandes; Defaults(Demandes); {Titre: txtTitre.Text}));;
Notify("Demande n°" & gblNouvelle.ID & " créée"; NotificationType.Success)`},"## Supprimer et traiter plusieurs lignes","`Remove(Demandes; ThisItem)` supprime un enregistrement. `ForAll` permet d'appliquer Patch à chaque ligne d'une collection (attention aux performances sur de gros volumes).","## SubmitForm ou Patch ?","SubmitForm est plus simple et gère la validation automatiquement : à utiliser pour un formulaire classique. Patch donne un contrôle total : à utiliser pour une action ponctuelle, un écran au design libre, ou l'écriture dans plusieurs tables à la fois."],notions:["Patch(Source; Defaults(Source); {…}) pour créer","Patch(Source; enregistrement; {…}) pour modifier","Choix : {Value: …} ; recherche : {Id; Value}","Patch renvoie l'enregistrement créé","Remove, ForAll","SubmitForm vs Patch"],ressources:[n("Fonction Patch","power-platform/power-fx/reference/function-patch"),P.patch,x.reza],recherche:"Patch choice column, Patch person column SharePoint, Patch lookup column"},{id:"l3-5",title:"La délégation",intro:"Par défaut, Power Apps ne récupère qu'un nombre limité de lignes. La délégation permet de confier le filtrage à la source de données. La mal comprendre est la cause n°1 de résultats incomplets.",objectifs:["Expliquer ce qu'est la délégation","Reconnaître un avertissement de délégation","Réécrire une formule pour la rendre délégable"],contenu:["## Le problème","Imaginez une liste de 20 000 demandes. Si Power Apps devait télécharger les 20 000 lignes pour les filtrer sur le téléphone, ce serait très lent. Deux cas se présentent :","- **La formule est délégable** : Power Apps envoie la question à la source (« donne-moi les demandes au statut En cours »), qui fait le travail et renvoie le résultat. Tout fonctionne, quel que soit le volume.","- **La formule n'est pas délégable** : Power Apps télécharge seulement les **500 premières lignes** (réglable jusqu'à **2 000**) et filtre localement. Les lignes suivantes sont ignorées sans aucun message d'erreur à l'utilisateur.",{attention:"Le piège : en test, votre liste ne contient que 50 éléments, donc tout semble fonctionner. Le problème n'apparaît qu'en production, des mois plus tard, quand la liste dépasse 500 éléments."},"## Repérer un avertissement","Power Apps Studio signale une formule non délégable par un **soulignement bleu** et une icône d'avertissement. Ne les ignorez jamais sur une source qui peut grossir.","## Ce qui est délégable dépend de la source","Chaque connecteur a sa liste. Pour SharePoint, par exemple : Filter, LookUp, Sort sur des colonnes simples, les opérateurs `=`, `<`, `>`, `StartsWith`… sont délégables. Search, `in`, `Len`, les calculs sur les colonnes dans un Filter ne le sont pas. Dataverse et SQL délèguent davantage d'opérations.","## Rendre une formule délégable","- Remplacer `Search` par `StartsWith` sur SharePoint.","- Filtrer d'abord avec une condition délégable pour réduire le volume, puis appliquer le reste.","- Stocker une valeur calculée dans une colonne au lieu de la recalculer dans le filtre.","- Indexer dans SharePoint les colonnes utilisées dans les filtres (indispensable au-delà de 5 000 éléments).","- Choisir une source plus puissante (Dataverse) si les besoins de recherche sont complexes."],notions:["Délégation : la source fait le filtrage","Limite de lignes : 500 par défaut, 2 000 maximum","Soulignement bleu = avertissement à traiter","Fonctions délégables propres à chaque source","StartsWith plutôt que Search sur SharePoint"],ressources:[n("Présentation de la délégation dans une application canevas","power-apps/maker/canvas-apps/delegation-overview"),n("Module de formation : limites de délégation","training/modules/work-with-data-source-limits-powerapps-canvas-app/"),P.delegation],recherche:"Power Apps delegation SharePoint, delegable functions, data row limit"},{id:"l3-6",title:"Validation et gestion des erreurs",intro:"Une application robuste vérifie les saisies avant d'enregistrer et informe clairement l'utilisateur quand quelque chose ne va pas.",objectifs:["Valider des champs obligatoires et des formats","Afficher des messages utiles","Intercepter et traiter une erreur d'enregistrement"],contenu:["## Valider avant d'enregistrer","Le meilleur message d'erreur est celui qu'on n'a pas besoin d'afficher. Désactivez le bouton tant que la saisie n'est pas correcte, et affichez sous le champ ce qui ne va pas.",{code:`// Format d'e-mail
IsMatch(txtEmail.Text; Match.Email)

// Message sous le champ (propriété Text d'une étiquette rouge)
If(!IsBlank(txtEmail.Text) && !IsMatch(txtEmail.Text; Match.Email);
   "Adresse e-mail invalide")`},"## Notify : informer l'utilisateur",{code:`Notify("Enregistré"; NotificationType.Success)
Notify("Champ manquant"; NotificationType.Warning)
Notify("Échec de l'enregistrement"; NotificationType.Error)`},"## Intercepter une erreur","Un enregistrement peut échouer : réseau coupé, droits insuffisants, valeur refusée par la source. `IfError` exécute une alternative en cas d'erreur :",{code:`IfError(
    Patch(Demandes; ThisItem; {Statut: {Value: "Terminée"}});
    Notify("Impossible de mettre à jour : " & FirstError.Message; NotificationType.Error)
)`},"La fonction `Errors(Demandes)` liste les erreurs survenues sur une source de données.","## Écrire de bons messages","Un bon message dit **ce qui s'est passé** et **quoi faire** : « La quantité doit être un nombre entre 1 et 10 » plutôt que « Erreur de saisie ». Évitez les codes techniques ; si besoin, gardez-les pour un journal technique."],notions:["Valider avant d'enregistrer : bouton désactivé, message sous le champ","IsMatch pour les formats","Notify et ses types","IfError, FirstError, Errors","Message = ce qui s'est passé + quoi faire"],ressources:[n("Fonctions Error, IfError, IsError","power-platform/power-fx/reference/function-iferror"),n("Fonction Notify","power-platform/power-fx/reference/function-showerror"),n("Fonctions IsMatch, Match et MatchAll","power-platform/power-fx/reference/function-ismatch"),p("YouTube","Power Apps error handling IfError","Cherchez aussi « Power Apps form validation » pour des exemples d'interface.")],recherche:"Power Apps IfError Notify, form validation"}],exercices:[{titre:"Mini-projet : app de demandes (v2)",enonce:"Ajoutez à votre app : une zone de recherche, un filtre par statut (liste déroulante avec « Toutes »), un filtre « Mes demandes », un tri par date, et un bouton « Marquer comme terminée » utilisant Patch.",livrable:"Une app où l'utilisateur trouve ses demandes en quelques secondes et change un statut en un clic."},{titre:"Chasse aux avertissements",enonce:"Relevez tous les avertissements de délégation de votre app. Pour chacun, expliquez la cause et proposez une correction.",livrable:"Un tableau : formule, cause, correction appliquée.",indice:"Pour vérifier l'effet de la limite, réduisez temporairement la limite de lignes dans les paramètres de l'app, puis comparez le nombre de résultats."},{titre:"Formulaire validé",enonce:"Rendez obligatoires 3 champs, validez le format d'une adresse e-mail, et affichez un message de succès ou d'erreur après l'enregistrement.",livrable:"Un formulaire qui ne peut pas être envoyé incomplet."}],quiz:[{q:"Quelle fonction crée une variable globale ?",options:["UpdateContext","Set","Collect","Var"],a:1,e:"Set(gblNom; valeur) est accessible depuis tous les écrans."},{q:"Quelle fonction renvoie UN seul enregistrement ?",options:["Filter","Search","LookUp","Sort"],a:2,e:"LookUp renvoie le premier enregistrement correspondant."},{q:"Comment créer un nouvel élément avec Patch ?",options:["Patch(Source; New; {…})","Patch(Source; Defaults(Source); {…})","Patch(Source; Blank(); {…})","Patch(Defaults; Source)"],a:1,e:"Defaults(Source) fournit un enregistrement vierge."},{q:"Comment écrire « En cours » dans une colonne SharePoint de type Choix ?",options:['Statut: "En cours"','Statut: {Value: "En cours"}','Statut.Value: "En cours"','Statut: Choice("En cours")'],a:1,e:"Une colonne Choix attend un enregistrement avec une propriété Value."},{q:"Un avertissement de délégation signifie que…",options:["L'app ne fonctionnera pas","Les résultats peuvent être incomplets sur de gros volumes","La licence est insuffisante","La formule a une faute de syntaxe"],a:1,e:"Le traitement se fait localement sur un nombre limité de lignes."},{q:"Quelle est la limite maximale configurable de lignes non délégables ?",options:["500","2000","5000","Illimitée"],a:1,e:"500 par défaut, jusqu'à 2000 dans les paramètres."},{q:"Sur SharePoint, quelle fonction de recherche textuelle est délégable ?",options:["Search","StartsWith","in","Len"],a:1,e:"StartsWith est délégable sur SharePoint, contrairement à Search."},{q:"Quelle fonction affiche un bandeau de message à l'utilisateur ?",options:["Alert","Notify","Message","Popup"],a:1,e:'Notify("Enregistré"; NotificationType.Success)'}]};var F={id:"m4",num:4,title:"Interface et expérience utilisateur",intro:"Une application utile doit aussi être agréable, lisible et utilisable sur tous les écrans. On apprend la mise en page responsive, les contrôles modernes, les composants réutilisables et l'accessibilité.",lessons:[{id:"l4-1",title:"Design responsive et conteneurs",intro:"Les conteneurs horizontaux et verticaux organisent les contrôles automatiquement, comme des boîtes qui s'adaptent à la taille de l'écran.",objectifs:["Construire un écran avec des conteneurs","Adapter l'application au téléphone, à la tablette et à l'ordinateur","Désactiver « Mettre à l'échelle » pour une vraie mise en page responsive"],contenu:["## Mise à l'échelle ou vraie adaptation","Par défaut, une application canevas est **mise à l'échelle** : elle est dessinée pour une taille fixe, puis agrandie ou réduite comme une image. Sur un grand écran, tout devient énorme ; sur un téléphone, tout devient minuscule. Pour une vraie adaptation, désactivez **Mettre à l'échelle** dans les paramètres d'affichage de l'application.","## Les conteneurs","- **Conteneur vertical** : empile ses contrôles de haut en bas.","- **Conteneur horizontal** : les aligne de gauche à droite.","- **Conteneur simple** : les contrôles se placent librement à l'intérieur.","Les propriétés clés : **Gap** (espace entre éléments), **Align** et **Justify** (alignement), **Wrap** (passer à la ligne quand la place manque), et pour chaque enfant **FillPortions** (la part de l'espace disponible qu'il occupe) et **Minimum Width**.","## Un modèle d'écran classique","Un écran se construit souvent ainsi : un conteneur vertical qui occupe tout l'écran, contenant un **en-tête** (hauteur fixe), une **zone de contenu** (FillPortions = 1, elle prend tout le reste) et éventuellement un **pied de page**. La zone de contenu est elle-même un conteneur horizontal avec une liste à gauche et le détail à droite.","## Points d'arrêt","La propriété `App.Width` et le **ScreenSize** (de 1 à 4, du téléphone au grand écran) permettent d'adapter la mise en page :",{code:`// Masquer le panneau de détail sur téléphone
Visible : App.ActiveScreen.Size > ScreenSize.Small

// Passer le conteneur en vertical sur petit écran
LayoutDirection : If(App.Width < 700; LayoutDirection.Vertical; LayoutDirection.Horizontal)`},{astuce:"Évitez les positions X/Y et tailles écrites « en dur » (X = 340). Dans un conteneur, laissez la mise en page calculer les positions pour vous."}],notions:["Désactiver « Mettre à l'échelle »","Conteneurs vertical, horizontal, simple","FillPortions, Gap, Align, Wrap","App.Width, ScreenSize et points d'arrêt","En-tête, contenu, pied de page"],ressources:[n("Création d'applications canevas réactives","power-apps/maker/canvas-apps/build-responsive-apps"),P.conteneurs,p("YouTube","Power Apps responsive design containers","Reza Dorrani et Shane Young ont des vidéos complètes sur ce sujet.")],recherche:"Power Apps responsive containers, auto-layout, ScreenSize"},{id:"l4-2",title:"Contrôles modernes et thèmes",intro:"Les contrôles modernes reprennent le système de design Fluent de Microsoft. Associés aux thèmes, ils donnent une application cohérente et actuelle avec peu d'effort.",objectifs:["Activer et utiliser les contrôles modernes","Appliquer un thème","Assurer la cohérence visuelle"],contenu:["## Contrôles classiques et modernes","Les contrôles **classiques** existent depuis les débuts de Power Apps : très personnalisables, mais d'apparence datée. Les contrôles **modernes** suivent le système de design **Fluent 2** (celui de Teams et Microsoft 365) : plus accessibles, plus homogènes, avec moins de propriétés à régler. Selon votre version, ils s'activent dans les paramètres de l'application (fonctionnalités à venir ou mises à jour).","## Les thèmes","Un thème définit les couleurs principales, appliquées automatiquement à tous les contrôles modernes. On choisit un thème prédéfini ou on crée le sien à partir de la couleur de l'organisation. Changer de thème met à jour toute l'application d'un coup.","## Construire une identité cohérente","- Deux ou trois couleurs maximum, plus des gris.","- Une seule police, deux ou trois tailles (titre, texte, légende).","- Des espacements réguliers (multiples de 4 ou 8 pixels).","- Les mêmes styles de boutons partout : un bouton principal coloré par écran, les autres en style secondaire.","Si vous utilisez des contrôles classiques, centralisez les couleurs dans des formules nommées pour pouvoir les changer à un seul endroit :",{code:`// App.Formulas
fxCouleurPrincipale = ColorValue("#0F6CBD");;
fxCouleurTexte = ColorValue("#242424");;`}],notions:["Contrôles modernes basés sur Fluent 2","Thèmes : couleurs appliquées partout","Peu de couleurs, une police, espacements réguliers","Couleurs centralisées dans des formules nommées"],ressources:[n("Vue d'ensemble des contrôles modernes et des thèmes","power-apps/maker/canvas-apps/controls/modern-controls/overview-modern-controls"),u("Fluent 2 : le système de design de Microsoft (en anglais)","https://fluent2.microsoft.design/"),p("YouTube","Power Apps modern controls themes","Le sujet évolue vite : privilégiez les vidéos de moins d'un an.")],recherche:"Power Apps modern controls themes, Fluent 2"},{id:"l4-3",title:"Composants réutilisables",intro:"Un composant est un bloc d'interface réutilisable : en-tête, menu, boîte de dialogue. On le construit une fois et on l'utilise partout, voire dans plusieurs applications.",objectifs:["Créer un composant avec des propriétés d'entrée et de sortie","Réutiliser un composant sur plusieurs écrans","Partager via une bibliothèque de composants"],contenu:["## Pourquoi des composants ?","Si votre en-tête (logo, titre, bouton retour) est copié sur dix écrans, une modification demande dix interventions, avec le risque d'en oublier une. Avec un composant, on modifie une fois et tous les écrans suivent.","## Créer un composant","Dans l'arborescence, onglet **Composants**, créez un nouveau composant et dessinez-le comme un mini-écran. Ajoutez ensuite des **propriétés personnalisées** :","- **Entrée** : une valeur fournie par l'écran qui utilise le composant (par exemple le titre à afficher).","- **Sortie** : une valeur que le composant renvoie à l'écran (par exemple l'option choisie dans un menu).","- **Comportement** : un événement que l'écran peut personnaliser (par exemple OnRetour).",{code:`// Dans le composant cmpEntete, l'étiquette affiche :
Text : cmpEntete.Titre

// Sur l'écran, l'instance du composant reçoit :
Titre : "Mes demandes"`},"## La bibliothèque de composants","Une **bibliothèque de composants** est un conteneur dédié, partagé dans l'environnement. Plusieurs applications y importent les mêmes composants. Quand la bibliothèque est mise à jour, chaque application propose d'intégrer la nouvelle version. C'est la base d'une charte graphique commune à toute une organisation."],notions:["Composant : construit une fois, utilisé partout","Propriétés d'entrée, de sortie, de comportement","Bibliothèque de composants partagée","Mise à jour centralisée"],ressources:[n("Vue d'ensemble des composants canevas","power-apps/maker/canvas-apps/create-component"),n("Bibliothèque de composants","power-apps/maker/canvas-apps/component-library"),p("YouTube","Power Apps component library custom properties","Cherchez aussi « Creator Kit » pour découvrir les composants prêts à l'emploi fournis par Microsoft.")],recherche:"Power Apps component library, custom properties, Creator Kit"},{id:"l4-4",title:"Accessibilité et bonnes pratiques UX",intro:"Une application accessible est utilisable par tous, y compris avec un lecteur d'écran ou au clavier. C'est une question d'équité, et souvent une obligation légale.",objectifs:["Utiliser le vérificateur d'accessibilité","Renseigner les propriétés d'accessibilité","Appliquer des règles UX simples"],contenu:["## Qui est concerné ?","Personnes aveugles ou malvoyantes (lecteur d'écran, zoom), daltoniennes, ayant des difficultés motrices (navigation au clavier uniquement), mais aussi toute personne fatiguée, en plein soleil ou utilisant son téléphone d'une main. L'accessibilité améliore l'application pour tout le monde.","## Les réglages dans Power Apps","- **AccessibleLabel** : le texte lu par le lecteur d'écran. Indispensable pour les icônes et images (« Supprimer la demande », pas « icône poubelle »).","- **Ordre de tabulation** : l'ordre dans lequel on parcourt l'écran au clavier doit suivre l'ordre visuel.","- **FocusedBorderThickness** : une bordure visible sur l'élément qui a le focus clavier.","- **Contraste** : texte et fond suffisamment contrastés (ratio d'au moins 4,5:1 pour le texte normal selon les WCAG).","- Zones cliquables assez grandes (au moins 44 × 44 pixels sur mobile).","## Le vérificateur d'accessibilité","Dans Power Apps Studio, ouvrez le **vérificateur d'application** puis la section **Accessibilité**. Il liste les problèmes par gravité (erreurs, avertissements, conseils) et vous amène directement à la propriété à corriger. Visez zéro erreur avant toute mise en production.","## Les références","Les **WCAG** (Web Content Accessibility Guidelines) du W3C sont la norme internationale. En France, le **RGAA** les décline en critères vérifiables et s'impose aux services publics. Pour tester vos couleurs, un vérificateur de contraste en ligne donne le ratio en un instant."],notions:["AccessibleLabel sur icônes et images","Ordre de tabulation et focus visible","Contraste 4,5:1 minimum pour le texte","Vérificateur d'accessibilité : zéro erreur","WCAG et RGAA"],ressources:[n("Créer des applications canevas accessibles","power-apps/maker/canvas-apps/accessible-apps"),n("Vérificateur d'accessibilité dans Power Apps Studio","power-apps/maker/canvas-apps/accessibility-checker"),u("W3C : Règles pour l'accessibilité des contenus Web (WCAG), vue d'ensemble en français","https://www.w3.org/WAI/standards-guidelines/wcag/fr"),u("RGAA : Référentiel général d'amélioration de l'accessibilité","https://accessibilite.numerique.gouv.fr/"),u("WebAIM : vérificateur de contraste des couleurs","https://webaim.org/resources/contrastchecker/")],recherche:"Power Apps accessibility checker, WCAG, contraste"}],exercices:[{titre:"Refonte responsive",enonce:"Reconstruisez l'écran liste de votre app avec des conteneurs pour qu'il s'affiche correctement sur téléphone (une colonne) et sur ordinateur (liste et détail côte à côte).",livrable:"Captures de l'app en format téléphone et ordinateur."},{titre:"Composant en-tête",enonce:"Créez un composant d'en-tête avec un titre (propriété d'entrée) et un bouton retour (propriété de comportement), puis utilisez-le sur tous les écrans.",livrable:"Un composant utilisé sur au moins 3 écrans."},{titre:"Audit d'accessibilité",enonce:"Lancez le vérificateur d'accessibilité et corrigez tous les problèmes signalés. Vérifiez le contraste de vos couleurs principales et parcourez l'app entièrement au clavier.",livrable:"Zéro erreur dans le vérificateur et une app utilisable au clavier."}],quiz:[{q:"Pour une vraie mise en page responsive, que faut-il désactiver ?",options:["Les contrôles modernes","Mettre à l'échelle","La délégation","Les thèmes"],a:1,e:"Sinon l'application est simplement agrandie ou réduite."},{q:"Quelle propriété répartit l'espace entre les éléments d'un conteneur ?",options:["FillPortions","Width","Padding","Size"],a:0,e:"FillPortions définit la part d'espace occupée par chaque élément."},{q:"Quel est l'intérêt d'un composant ?",options:["Accélérer la base de données","Réutiliser un élément d'interface et le maintenir à un seul endroit","Contourner la délégation","Remplacer les écrans"],a:1,e:"Une modification du composant se répercute partout."},{q:"Une propriété de sortie d'un composant sert à…",options:["Recevoir une valeur de l'écran","Renvoyer une valeur à l'écran qui l'utilise","Changer de thème","Supprimer le composant"],a:1,e:"Entrée : l'écran fournit une valeur ; sortie : le composant en renvoie une."},{q:"Quelle propriété décrit un contrôle pour un lecteur d'écran ?",options:["Tooltip","AccessibleLabel","Text","HintText"],a:1,e:"AccessibleLabel est lu par les technologies d'assistance."},{q:"Quelle est la norme internationale d'accessibilité du web ?",options:["ISO 9001","WCAG","RGPD","HTML5"],a:1,e:"Les WCAG du W3C ; le RGAA en est la déclinaison française."}]},V={id:"m5",num:5,title:"Données avancées et Dataverse",intro:"On compare les sources de données, on découvre Dataverse, la base de données de la Power Platform, son modèle de sécurité, et les applications pilotées par modèle.",lessons:[{id:"l5-1",title:"Comparer et choisir une source de données",intro:"SharePoint, Dataverse, SQL, Excel : chaque source a ses forces, ses limites et un impact sur les licences.",objectifs:["Comparer les principales sources","Choisir selon le volume, la sécurité, les relations et les licences","Éviter Excel comme base de production"],contenu:["## Les principales options","- **Excel (sur OneDrive ou SharePoint)** : facile pour un prototype, mais pas fait pour plusieurs utilisateurs simultanés, peu performant, aucune délégation. À réserver aux essais.","- **Listes SharePoint** : incluses dans Microsoft 365 (connecteur standard), simples à créer, suffisantes pour des milliers d'éléments et des besoins simples. Limites : relations complexes, sécurité par ligne, performances au-delà de quelques dizaines de milliers d'éléments.","- **Dataverse** : une vraie base relationnelle, avec types riches, relations, règles métier, sécurité fine et audit. Connecteur premium (sauf Dataverse for Teams).","- **SQL Server / Azure SQL** : pour de gros volumes ou quand la base existe déjà. Premium, et demande des compétences de base de données.","## Une grille de décision","Posez-vous ces questions : combien de lignes dans trois ans ? Combien de tables liées ? Faut-il que chaque utilisateur ne voie que ses propres données ? Les utilisateurs ont-ils des licences premium ? Les données existent-elles déjà quelque part ?",{exemple:"Les demandes de matériel d'une équipe de 30 personnes : SharePoint suffit. La même application pour 5 000 employés avec des droits différents par site et un historique d'audit : Dataverse devient pertinent."},"## Changer de source plus tard","Migrer coûte cher : il faut réécrire de nombreuses formules (les noms et types de colonnes changent). D'où l'importance de bien choisir dès la conception, en tenant compte de l'évolution prévisible."],notions:["Excel : prototypage uniquement","SharePoint : simple, inclus, limites sur relations et sécurité","Dataverse : relationnel, sécurisé, premium","SQL : gros volumes, premium","Choisir selon volume, relations, sécurité, licences"],ressources:[n("Comprendre les sources de données pour les applications canevas","power-apps/maker/canvas-apps/working-with-data-sources"),n("Vue d'ensemble des licences Power Platform","power-platform/admin/pricing-billing-skus"),p("YouTube","SharePoint vs Dataverse for Power Apps","Comparez au moins deux vidéos : les avis divergent selon le contexte.")],recherche:"SharePoint vs Dataverse vs SQL Power Apps"},{id:"l5-2",title:"Introduction à Dataverse",intro:"Dataverse stocke les données dans des tables avec des types riches, des relations, des règles et une sécurité intégrée. C'est la base de données native de la Power Platform.",objectifs:["Créer des tables et des colonnes Dataverse","Créer des relations entre tables","Connecter une app canevas à Dataverse"],contenu:["## Tables standard et personnalisées","Dataverse contient déjà des **tables standard** (Compte, Contact, Utilisateur…), communes à toutes les applications Microsoft. Vous créez vos propres **tables personnalisées** (Demande, Matériel) dans make.powerapps.com, section **Tables**. Chaque table a une **colonne principale** (Primary name) : le texte qui identifie une ligne aux yeux de l'utilisateur.","## Des types de colonnes riches","Texte, nombre entier ou décimal, devise, date, oui/non, e-mail, URL, fichier, image… et des **choix** que l'on peut partager entre plusieurs tables (**choix globaux**). On peut aussi créer des **colonnes calculées** (formules) et des **colonnes de cumul** (somme, nombre de lignes liées).","## Les relations","Une relation **plusieurs-à-un** se crée en ajoutant une colonne de type **Recherche** : chaque demande pointe vers un matériel. Dataverse gère aussi les relations **plusieurs-à-plusieurs** nativement, sans que vous ayez à créer la table intermédiaire. C'est le modèle de données du module 1, directement traduit.","## Dans une app canevas","On ajoute la table comme source de données. Les relations se parcourent avec un simple point, et les filtres sont largement délégables :",{code:`ThisItem.Matériel.Nom            // suivre la relation
Filter(Demandes; Matériel.Catégorie = "Écran")`},{astuce:"Le plan Développeur vous donne un environnement Dataverse gratuit : c'est le bon endroit pour vous exercer."}],notions:["Tables standard et personnalisées","Colonne principale (Primary name)","Choix globaux, colonnes calculées et de cumul","Relations plusieurs-à-un et plusieurs-à-plusieurs","Parcourir une relation avec un point"],ressources:[n("Qu'est-ce que Microsoft Dataverse ?","power-apps/maker/data-platform/data-platform-intro"),n("Créer une table personnalisée Dataverse","power-apps/maker/data-platform/create-edit-entities"),n("Types de données de colonne dans Dataverse","power-apps/maker/data-platform/types-of-fields"),x.april],recherche:"Dataverse tables relationships tutorial"},{id:"l5-3",title:"Sécurité : rôles et permissions",intro:"Qui voit quoi ? Dataverse gère la sécurité au niveau des tables, des lignes et des colonnes grâce aux rôles de sécurité.",objectifs:["Comprendre le modèle de sécurité de Dataverse","Lire et créer un rôle de sécurité","Distinguer sécurité de l'interface et sécurité des données"],contenu:["## Masquer n'est pas sécuriser","Cacher un bouton « Supprimer » dans l'application n'empêche pas un utilisateur malin d'accéder aux données par un autre chemin (un autre outil, une autre application, l'API). La vraie sécurité doit être appliquée **par la source de données**. C'est l'une des grandes forces de Dataverse.","## Rôles de sécurité et privilèges","Un **rôle de sécurité** liste, pour chaque table, les **privilèges** accordés : créer, lire, écrire, supprimer, ajouter, ajouter à, attribuer, partager. Pour chaque privilège, on choisit un **niveau d'accès** :","- **Utilisateur** : seulement les lignes dont on est propriétaire.","- **Unité commerciale** : les lignes de son unité (service, site).","- **Unité commerciale parent/enfant** : son unité et celles qui en dépendent.","- **Organisation** : toutes les lignes.",{exemple:"Rôle Demandeur : Demandes = créer (Utilisateur), lire (Utilisateur), écrire (Utilisateur). Rôle Service IT : Demandes = lire et écrire (Organisation). Chacun ne voit donc que ce qui le concerne, sans aucune formule dans l'application."},"## Unités commerciales et équipes","Les **unités commerciales** reproduisent l'organisation (directions, sites). Les **équipes** regroupent des utilisateurs pour leur attribuer des rôles ensemble, ce qui simplifie l'administration.","## Sécurité des colonnes","Pour une information sensible (salaire, donnée médicale), la **sécurité au niveau des colonnes** limite qui peut lire ou modifier une colonne précise, même si la ligne est visible."],notions:["La sécurité se fait dans la source, pas dans l'interface","Rôle de sécurité = privilèges par table","Niveaux : utilisateur, unité, parent/enfant, organisation","Unités commerciales et équipes","Sécurité au niveau des colonnes"],ressources:[n("Rôles et privilèges de sécurité pour Dataverse","power-platform/admin/security-roles-privileges"),n("Sécurité et gouvernance dans Power Platform","power-platform/admin/governance-considerations"),p("YouTube","Dataverse security roles business units explained","Cherchez une démonstration où l'auteur se connecte avec deux comptes différents.")],recherche:"Dataverse security roles business units, column level security"},{id:"l5-4",title:"Applications pilotées par modèle",intro:"Les applications pilotées par modèle sont générées à partir des tables Dataverse. Idéales pour le back-office, elles demandent très peu de travail de mise en page.",objectifs:["Créer une application pilotée par modèle","Configurer des formulaires et des vues","Ajouter des règles métier sans code"],contenu:["## Le principe","Au lieu de dessiner chaque écran, vous décrivez **quelles tables** l'application utilise, **quelles vues** (listes filtrées) et **quels formulaires**. Power Apps génère une interface standard, responsive et accessible, avec recherche, tri, export Excel et graphiques. L'apparence est moins libre qu'une app canevas, mais le développement est beaucoup plus rapide pour des écrans de gestion.","## Les briques","- **Vues** : des listes de lignes filtrées et triées (« Demandes en attente », « Mes demandes »).","- **Formulaires** : principal (toutes les informations), rapide (création express), carte (aperçu).","- **Graphiques et tableaux de bord** : pour suivre l'activité.","- **Navigation** : le plan du site, qui organise les tables dans le menu de gauche.","## Les règles métier","Une **règle métier** applique une logique sans écrire de code : rendre un champ obligatoire, définir une valeur par défaut, afficher un message, masquer un champ selon une condition. Exemple : « si Statut = Refusée, alors Motif du refus est obligatoire ». Selon sa portée, la règle s'applique dans les formulaires seulement ou aussi côté serveur (donc pour toutes les applications).","## Canevas et modèle ensemble","Un schéma fréquent : une **app canevas** simple et mobile pour les utilisateurs terrain, et une **app pilotée par modèle** pour l'équipe qui gère les données. Les deux partagent les mêmes tables Dataverse et les mêmes règles de sécurité."],notions:["Application générée à partir des tables","Vues, formulaires, graphiques, tableaux de bord","Règles métier sans code","Canevas pour le terrain, modèle pour le back-office"],ressources:[n("Vue d'ensemble des applications pilotées par modèle","power-apps/maker/model-driven-apps/model-driven-app-overview"),n("Créer une règle métier dans Dataverse","power-apps/maker/data-platform/data-platform-create-business-rule"),p("YouTube","model driven app tutorial for beginners","Choisissez une vidéo récente : le concepteur d'application a été modernisé.")],recherche:"model-driven app forms views business rules"}],exercices:[{titre:"Migration vers Dataverse",enonce:"Dans votre environnement Développeur, recréez le modèle de données de votre projet dans Dataverse (au moins 3 tables liées).",livrable:"Les tables avec leurs relations et un jeu de données de test."},{titre:"Back-office",enonce:"Créez une app pilotée par modèle pour le service informatique : une vue « Demandes en attente », un formulaire, et une règle métier (motif obligatoire si statut = Refusée).",livrable:"Une app pilotée par modèle fonctionnelle."},{titre:"Matrice de sécurité",enonce:"Définissez 3 rôles (Demandeur, Manager, Service IT) et leurs droits sur chaque table. Créez au moins un rôle dans Dataverse et testez-le avec un second compte si possible.",livrable:"Une matrice rôles × tables × privilèges."}],quiz:[{q:"Quelle source est à éviter pour une application en production ?",options:["Dataverse","SQL","Excel","SharePoint"],a:2,e:"Excel convient au prototypage mais pas aux usages simultanés."},{q:"Masquer un bouton dans l'application suffit-il à sécuriser une donnée ?",options:["Oui","Non, il faut sécuriser au niveau de la source","Seulement sur mobile","Seulement avec Dataverse"],a:1,e:"La sécurité doit être portée par la source de données."},{q:"Dans un rôle de sécurité, le niveau « Utilisateur » sur Lire signifie…",options:["Lire toutes les lignes","Lire seulement les lignes dont on est propriétaire","Ne rien lire","Lire les lignes de son unité"],a:1,e:"Utilisateur = ses propres lignes uniquement."},{q:"Les applications pilotées par modèle reposent sur…",options:["SharePoint","Excel","Dataverse","SQL uniquement"],a:2,e:"Elles sont générées à partir des tables Dataverse."},{q:"Une règle métier dans Dataverse permet…",options:["D'écrire du C#","D'appliquer une logique sans code (champ obligatoire, valeur par défaut…)","De créer un flux","De gérer les licences"],a:1,e:"Les règles métier s'appliquent dans les formulaires, et côté serveur selon leur portée."},{q:"Dataverse fait-il partie des connecteurs standard ?",options:["Oui, toujours","Non, il nécessite en général une licence premium","Seulement le week-end","Uniquement dans Excel"],a:1,e:"Sauf Dataverse for Teams, l'usage relève des licences premium."}]};var Q={id:"m6",num:6,title:"Power Automate",intro:"On met Power Apps de côté pour apprendre Power Automate en tant que tel : automatiser des tâches et des processus, sans interface, à partir d'un déclencheur.",lessons:[{id:"l6-1",title:"Concepts de Power Automate",intro:"Un flux suit toujours le même schéma : un déclencheur (« quand… ») puis des actions (« faire… »). Il existe plusieurs types de flux selon ce qui les déclenche.",objectifs:["Expliquer déclencheur, action et connecteur","Distinguer les types de flux","Se repérer dans le concepteur"],contenu:["## Déclencheur et actions","Un flux commence par **un seul déclencheur** : l'événement qui le démarre. Viennent ensuite **une ou plusieurs actions**, exécutées dans l'ordre. Chaque déclencheur et chaque action appartient à un **connecteur** (Outlook, SharePoint, Teams, Approbations…). Pour agir en votre nom, le connecteur utilise une **connexion** : votre compte, authentifié une fois.",{exemple:"Quand un e-mail arrive avec une pièce jointe (déclencheur Outlook) → enregistrer la pièce jointe dans OneDrive (action OneDrive) → publier un message dans Teams (action Teams)."},"## Les types de flux","- **Flux de cloud automatisé** : démarre sur un événement (nouvel élément SharePoint, e-mail reçu, fichier créé).","- **Flux de cloud instantané** : démarre quand quelqu'un le lance (bouton, depuis Power Apps, depuis Teams).","- **Flux de cloud planifié** : démarre à intervalles réguliers (tous les lundis à 8 h).","- **Flux de bureau** : automatise des actions sur un ordinateur (RPA), pour des applications sans connecteur.","## Le concepteur","Le concepteur affiche le flux de haut en bas. On ajoute une étape avec le **+**, on la configure dans le volet de paramètres. Copilot peut générer un premier flux à partir d'une description en langage naturel : pratique pour démarrer, mais relisez toujours ce qu'il propose.",{astuce:"Nommez chaque action selon ce qu'elle fait (« Obtenir les demandes ouvertes » plutôt que « Obtenir les éléments 2 »). Dans un flux de vingt étapes, cela change tout."}],notions:["Un déclencheur, puis des actions","Connecteur et connexion","Flux automatisé, instantané, planifié, de bureau","Copilot pour démarrer, relecture obligatoire","Renommer les actions"],ressources:[n("Qu'est-ce que Power Automate ?","power-automate/flow-types"),n("Découvrir la page d'accueil Power Automate","power-automate/getting-started"),n("Module de formation : Prise en main de Power Automate","training/modules/get-started-flows/"),p("YouTube","Power Automate tutorial for beginners","Vérifiez que la vidéo montre le nouveau concepteur (étapes sous forme de cartes).")],recherche:"Power Automate cloud flow types tutorial"},{id:"l6-2",title:"Premier flux automatisé",intro:"On construit un flux qui réagit tout seul à un événement : envoyer un e-mail quand un élément est ajouté à une liste SharePoint.",objectifs:["Créer un flux automatisé de bout en bout","Utiliser le contenu dynamique","Tester et lire l'historique d'exécution"],contenu:["## Construire le flux","1. **Créer → Flux de cloud automatisé**, choisir le déclencheur SharePoint **« Lorsqu'un élément est créé »**, puis le site et la liste.","2. Ajouter l'action Office 365 Outlook **« Envoyer un e-mail (V2) »**.","3. Remplir le destinataire, l'objet et le corps en utilisant le **contenu dynamique**.","## Le contenu dynamique","Chaque étape produit des **sorties** : le déclencheur SharePoint fournit le titre de l'élément, son créateur, sa date… Dans les champs des actions suivantes, le bouton éclair (ou la touche /) propose ces valeurs. Vous composez ainsi un e-mail personnalisé : « Nouvelle demande de [Créé par Nom complet] : [Titre] ».","## Tester","Le bouton **Tester** permet de déclencher le flux manuellement : vous ajoutez un élément dans la liste, et le flux s'exécute sous vos yeux. Chaque étape affiche une coche verte ou une croix rouge. Cliquez sur une étape pour voir exactement ses **entrées** et **sorties** : c'est l'outil de diagnostic principal.","## L'historique","La page du flux liste les **28 derniers jours d'exécutions** avec leur statut. En cas d'échec, ouvrez l'exécution concernée et remontez jusqu'à la première étape en rouge : le message d'erreur y est détaillé.",{attention:"Un flux s'exécute avec les connexions de son propriétaire. Si vous quittez l'organisation ou changez de mot de passe, le flux peut s'arrêter. Pour un flux important, ajoutez un copropriétaire."}],notions:["Déclencheur « Lorsqu'un élément est créé »","Action « Envoyer un e-mail (V2) »","Contenu dynamique = sorties des étapes précédentes","Tester et lire entrées/sorties","Historique d'exécution, copropriétaires"],ressources:[n("Créer un flux de cloud dans Power Automate","power-automate/get-started-logic-flow"),n("Parcours de formation : Automatiser un processus métier avec Power Automate","training/paths/automate-process-power-automate/"),x.reza],recherche:"Power Automate when an item is created send email, dynamic content"},{id:"l6-3",title:"Conditions, boucles et variables",intro:"Pour traiter des cas différents ou plusieurs éléments à la fois, un flux utilise des conditions, des boucles et des variables.",objectifs:["Ajouter une condition et un switch","Parcourir une liste d'éléments","Utiliser des variables dans un flux"],contenu:["## Condition","L'action **Condition** compare deux valeurs et crée deux branches : **Si oui** et **Si non**. Exemple : si le montant est supérieur à 500 €, envoyer pour approbation au directeur, sinon au manager. Pour plus de deux cas, l'action **Switch** crée une branche par valeur.","## Boucles","- **Appliquer à chacun (Apply to each)** : exécute les actions pour chaque élément d'une liste. Par exemple, après « Obtenir les éléments », envoyer un rappel pour chaque demande en retard.","- **Faire jusqu'à (Do until)** : répète les actions jusqu'à ce qu'une condition soit vraie (avec une limite de tentatives pour éviter une boucle infinie).","## Filtrer à la source","Plutôt que de récupérer toute une liste puis de tester chaque élément dans une boucle, filtrez directement dans l'action **Obtenir les éléments** grâce à la **requête de filtre** (syntaxe OData). C'est beaucoup plus rapide :",{code:"Statut eq 'En cours' and Quantite gt 5"},"## Variables","Une variable se crée avec **Initialiser une variable** (au premier niveau du flux, pas dans une boucle), puis se modifie avec **Définir la variable**, **Incrémenter** ou **Ajouter à une variable de tableau / chaîne**. Exemple : compter les demandes en retard, ou construire la liste des éléments à inclure dans un e-mail récapitulatif."],notions:["Condition (Si oui / Si non) et Switch","Appliquer à chacun, Faire jusqu'à","Requête de filtre OData dans Obtenir les éléments","Initialiser puis définir une variable"],ressources:[n("Ajouter une condition à un flux de cloud","power-automate/add-condition"),n("Utiliser « Appliquer à chacun » pour traiter une liste","power-automate/apply-to-each"),p("YouTube","Power Automate Get items filter query SharePoint","Les requêtes de filtre OData sont un sujet très bien couvert en vidéo.")],recherche:"Power Automate condition apply to each variables, filter query OData"},{id:"l6-4",title:"Expressions et données JSON",intro:"Les expressions transforment les données : formater une date, découper un texte, calculer. Elles sont la clé des flux avancés.",objectifs:["Écrire des expressions courantes","Manipuler les dates et le texte","Comprendre le format JSON des données"],contenu:["## Où écrire une expression","Dans un champ, choisissez **Expression** (le bouton fx) au lieu du contenu dynamique. Le langage n'est pas Power Fx : c'est celui des workflows Azure Logic Apps, avec une syntaxe de fonctions en anglais.","## Expressions courantes",{code:`utcNow()                                         // date et heure actuelles (UTC)
formatDateTime(utcNow(), 'dd/MM/yyyy')           // 08/10/2026
addDays(utcNow(), 7)                             // dans 7 jours
concat('Demande n°', triggerBody()?['ID'])        // assembler du texte
toUpper('bonjour')                               // BONJOUR
split('a;b;c', ';')                              // ['a','b','c']
if(equals(variables('Total'), 0), 'Aucune', 'Des demandes')
empty(body('Obtenir_les_elements')?['value'])      // la liste est-elle vide ?`},"Attention : dans les expressions, les arguments sont toujours séparés par des virgules, quelle que soit la langue.","## Les données sont du JSON","Toutes les données qui circulent dans un flux sont au format **JSON** : des paires clé-valeur entre accolades, et des listes entre crochets. Ouvrir les sorties brutes d'une étape (« Afficher les sorties brutes ») permet de comprendre leur structure.",{code:`{
  "ID": 42,
  "Title": "Écran 27 pouces",
  "Statut": { "Value": "En cours" }
}`},"## Composer et Analyser JSON","L'action **Composer** stocke le résultat d'une expression pour le réutiliser et le vérifier dans l'historique (très utile pour déboguer). L'action **Analyser JSON** (Parse JSON) lit un texte JSON et rend ses champs disponibles dans le contenu dynamique."],notions:["Expressions : langage des workflows, pas Power Fx","formatDateTime, utcNow, addDays, concat, split, if, empty","Virgules comme séparateurs dans les expressions","JSON : objets {} et tableaux []","Composer pour déboguer, Analyser JSON"],ressources:[n("Référence des fonctions dans les expressions de flux de travail","azure/logic-apps/workflow-definition-language-functions-reference"),u("JSON.org : présentation du format JSON (en français)","https://www.json.org/json-fr.html"),p("YouTube","Power Automate expressions formatDateTime","Cherchez aussi « Power Automate Parse JSON » pour la seconde partie.")],recherche:"Power Automate expressions formatDateTime, Parse JSON"},{id:"l6-5",title:"Flux d'approbation",intro:"Les approbations sont l'un des usages les plus fréquents : soumettre une demande à un responsable, attendre sa réponse, puis agir en conséquence.",objectifs:["Créer un flux d'approbation","Choisir le bon type d'approbation","Mettre à jour la source selon la réponse"],contenu:["## L'action clé","L'action **« Démarrer et attendre une approbation »** envoie la demande au(x) approbateur(s), puis met le flux en pause jusqu'à la réponse. L'approbateur reçoit un e-mail interactif et une notification dans Teams ; il peut répondre depuis Outlook, Teams, l'application mobile ou le centre d'approbations.","## Les types d'approbation","- **Approuver/Refuser – Premier à répondre** : la première réponse décide.","- **Approuver/Refuser – Tout le monde doit approuver** : un seul refus suffit à refuser.","- **Réponses personnalisées** : vous définissez vos propres boutons (Accepter, Refuser, Demander des précisions).","## Agir selon la réponse","Après l'approbation, une **Condition** teste la sortie **Résultat** (« Approve » ou « Reject ») :","- Si oui : mettre à jour l'élément SharePoint (Statut = Approuvée) et prévenir le demandeur.","- Si non : mettre à jour (Statut = Refusée), avec le commentaire de l'approbateur dans l'e-mail.","## Approbations en plusieurs niveaux","Pour une approbation **séquentielle** (manager puis direction), enchaînez deux actions d'approbation, la seconde dans la branche « Si oui » de la première. Le connecteur Office 365 Utilisateurs permet de trouver automatiquement le manager du demandeur.",{attention:"Un flux de cloud ne peut pas attendre indéfiniment : une exécution s'arrête au bout de 30 jours. Pour les approbations longues, prévoyez des relances ou une gestion de l'expiration."}],notions:["« Démarrer et attendre une approbation »","Premier à répondre / tout le monde doit approuver / réponses personnalisées","Condition sur le résultat","Approbation séquentielle, manager via Office 365 Utilisateurs","Limite de 30 jours par exécution"],ressources:[n("Créer et tester un flux d'approbation","power-automate/modern-approvals"),n("Module de formation : Automatiser un processus d'approbation","training/modules/approvals-power-automate/"),x.april],recherche:"Power Automate approval sequential parallel, get manager"},{id:"l6-6",title:"Gestion des erreurs et suivi",intro:"Un flux en production doit gérer ses échecs : réessayer, prévenir quelqu'un, journaliser. On apprend à rendre ses flux fiables.",objectifs:["Configurer « Exécuter après »","Structurer un flux avec des étendues (Try/Catch)","Analyser un échec dans l'historique"],contenu:["## Ce qui peut échouer","Un service temporairement indisponible, un élément supprimé entre-temps, une connexion expirée, une donnée inattendue… Sans gestion des erreurs, le flux s'arrête en échec et personne n'est prévenu.","## Exécuter après","Par défaut, une action ne s'exécute que si la précédente a **réussi**. Le réglage **« Exécuter après »** (Run after) d'une action permet de la lancer aussi quand la précédente a **échoué**, a **expiré** ou a été **ignorée**.","## Le modèle Try / Catch / Finally","- Une **étendue (Scope)** « Try » regroupe les actions principales.","- Une étendue « Catch », configurée pour s'exécuter après l'échec de Try, prévient le propriétaire (e-mail ou message Teams avec un lien vers l'exécution).","- Une étendue « Finally », exécutée dans tous les cas, fait le ménage si nécessaire.","- Une action **Terminer** (Terminate) en fin de Catch marque l'exécution comme échouée, pour qu'elle apparaisse bien en rouge dans l'historique.","## Nouvelles tentatives","Beaucoup d'actions ont une **stratégie de nouvelle tentative** dans leurs paramètres : en cas d'erreur temporaire, l'action réessaie automatiquement plusieurs fois. C'est souvent suffisant pour les petites coupures réseau."],notions:["Exécuter après : réussite, échec, expiration, ignoré","Étendues Try / Catch / Finally","Terminer pour marquer l'échec","Stratégie de nouvelle tentative","Prévenir le propriétaire avec un lien vers l'exécution"],ressources:[n("Utiliser une gestion robuste des erreurs (Power Automate)","power-automate/guidance/coding-guidelines/error-handling"),P.erreursFlux,p("YouTube","Power Automate try catch scope run after","Cherchez une démonstration complète avec notification d'échec.")],recherche:"Power Automate try catch scope run after"},{id:"l6-7",title:"Flux planifiés et flux de bureau",intro:"Pour finir le module, on découvre les flux planifiés (tâches récurrentes) et les flux de bureau (RPA), qui automatisent des applications sans connecteur.",objectifs:["Créer un flux planifié","Comprendre le principe de la RPA","Savoir quand choisir un flux de bureau"],contenu:["## Les flux planifiés","Le déclencheur **Périodicité** (Recurrence) lance le flux à intervalles réguliers : toutes les heures, chaque jour à 7 h, le premier lundi du mois… Pensez à régler le **fuseau horaire**, sinon le flux s'exécute à l'heure UTC.",{exemple:"Chaque lundi à 8 h : obtenir les demandes ouvertes depuis plus de 7 jours, les mettre en forme avec « Créer un tableau HTML », et envoyer le récapitulatif au service IT."},"## La RPA et les flux de bureau","Certaines applications n'ont ni connecteur ni API : vieux logiciel métier, site web sans interface de programmation, fichiers à saisir à la main. La **RPA** (automatisation robotisée des processus) reproduit les actions d'un humain : cliquer, taper, copier, lire l'écran. Dans la Power Platform, c'est le rôle de **Power Automate pour le bureau**, qui s'installe sur un ordinateur Windows.","- **Mode attended (assisté)** : le flux tourne pendant que l'utilisateur est connecté, souvent lancé par lui.","- **Mode unattended (non assisté)** : le flux tourne seul sur une machine dédiée.","## Quand choisir la RPA ?","En dernier recours. Un flux de bureau est plus fragile qu'un connecteur : si l'interface de l'application change (un bouton déplacé), il casse. Vérifiez toujours d'abord s'il existe un connecteur ou une API. Le mode non assisté nécessite en outre une licence spécifique."],notions:["Déclencheur Périodicité et fuseau horaire","Créer un tableau HTML pour un récapitulatif","RPA : reproduire les actions d'un humain","Modes attended et unattended","La RPA en dernier recours"],ressources:[n("Exécuter un flux de cloud selon une planification","power-automate/run-scheduled-tasks"),n("Introduction aux flux de bureau","power-automate/desktop-flows/introduction"),g("Automatisation robotisée des processus","Robotic_process_automation")],recherche:"Power Automate Desktop tutorial, scheduled flow recurrence"}],exercices:[{titre:"Notification automatique",enonce:"Créez un flux qui envoie un e-mail au demandeur quand le statut de sa demande passe à « Terminée ».",livrable:"Un flux testé avec au moins 2 exécutions réussies.",indice:"Utilisez le déclencheur « Lorsqu'un élément est créé ou modifié » et une condition sur le statut."},{titre:"Rappel hebdomadaire",enonce:"Créez un flux planifié chaque lundi qui envoie au service IT la liste des demandes encore ouvertes sous forme de tableau HTML.",livrable:"Un e-mail lisible listant les demandes ouvertes.",indice:"Actions utiles : Obtenir les éléments (avec requête de filtre), Sélectionner, Créer un tableau HTML."},{titre:"Mini-projet : approbation sans app",enonce:"Créez un flux : quand une demande est créée, envoyer une approbation au manager, puis mettre à jour le statut (Approuvée / Refusée) et prévenir le demandeur. Ajoutez une gestion d'erreur Try/Catch.",livrable:"Un flux d'approbation complet avec gestion des erreurs."}],quiz:[{q:"Quel type de flux démarre sur un événement (par exemple un nouvel e-mail) ?",options:["Instantané","Automatisé","Planifié","De bureau"],a:1,e:"Le flux automatisé réagit à un événement."},{q:"Combien de déclencheurs un flux peut-il avoir ?",options:["Un seul","Deux","Autant qu'on veut","Aucun"],a:0,e:"Un flux démarre toujours par un seul déclencheur."},{q:"Quelle action permet de parcourir une liste d'éléments ?",options:["Condition","Appliquer à chacun","Composer","Terminer"],a:1,e:"Apply to each traite chaque élément d'un tableau."},{q:"Quelle expression renvoie la date et l'heure actuelles (UTC) ?",options:["now()","today()","utcNow()","date()"],a:2,e:"utcNow(), puis formatDateTime pour le format voulu."},{q:"À quoi sert « Exécuter après » ?",options:["Planifier un flux","Exécuter une action selon le résultat (réussite, échec…) de la précédente","Retarder un e-mail","Partager le flux"],a:1,e:"C'est la base du modèle Try/Catch."},{q:"Quand utiliser un flux de bureau (RPA) ?",options:["Toujours","Quand l'application à automatiser n'a ni connecteur ni API","Pour envoyer un e-mail","Pour remplacer Dataverse"],a:1,e:"La RPA simule les actions d'un utilisateur ; c'est un dernier recours."}]},B={id:"m7",num:7,title:"Power Apps + Power Automate",intro:"Vous maîtrisez maintenant les deux outils séparément. On les relie : l'application déclenche des flux, leur transmet des données et récupère des résultats.",lessons:[{id:"l7-1",title:"Appeler un flux depuis une application",intro:"Le déclencheur Power Apps (V2) permet à une application de lancer un flux en lui passant des paramètres typés.",objectifs:["Créer un flux avec le déclencheur Power Apps (V2)","Ajouter le flux à une application","Passer des paramètres"],contenu:["## Pourquoi passer par un flux ?","Certaines actions sont impossibles ou peu pratiques dans Power Apps seul : envoyer un e-mail mis en forme depuis une boîte partagée, générer un PDF, créer un dossier, lancer une approbation, appeler un service externe, ou exécuter une action avec des droits différents de ceux de l'utilisateur.","## Créer le flux","Le plus simple : dans Power Apps Studio, ouvrez le volet **Power Automate** et créez un flux à partir de là. Le déclencheur **« Lorsque Power Apps appelle un flux (V2) »** permet de déclarer des **paramètres d'entrée** typés : texte, nombre, oui/non, date, e-mail, fichier.",{exemple:"Paramètres : IdDemande (nombre), Commentaire (texte). Actions : obtenir la demande SharePoint correspondante, envoyer un e-mail au manager avec le commentaire."},"## L'appeler depuis l'application","Une fois le flux ajouté à l'application, il s'utilise comme une fonction, avec la méthode **Run** :",{code:"EnvoyerAuManager.Run(galDemandes.Selected.ID; txtCommentaire.Text)"},"## Les pièges courants","- Après avoir modifié les paramètres du flux, il faut **actualiser** le flux dans l'application (ou le retirer et l'ajouter de nouveau), sinon l'application garde l'ancienne signature.","- Le flux s'exécute avec les **connexions de l'utilisateur** de l'application (pour les connecteurs qui l'exigent) : chaque utilisateur doit avoir accès aux ressources utilisées.","- Un appel de flux prend quelques secondes : affichez un indicateur de chargement."],notions:["Déclencheur « Lorsque Power Apps appelle un flux (V2) »","Paramètres d'entrée typés","NomDuFlux.Run(paramètres)","Actualiser le flux après modification","Contexte de connexion de l'utilisateur"],ressources:[n("Utiliser le volet Power Automate dans Power Apps","power-apps/maker/canvas-apps/working-with-flows"),p("YouTube","Power Apps V2 trigger Power Automate","Reza Dorrani a une vidéo de référence sur le déclencheur V2.")],recherche:"Power Apps V2 trigger Power Automate, Run flow from Power Apps"},{id:"l7-2",title:"Renvoyer des données vers l'application",intro:"Un flux peut répondre à l'application : un statut, un identifiant, un lien de fichier, voire un tableau de données.",objectifs:["Utiliser « Répondre à une application ou un flux Power Apps »","Récupérer le résultat dans une variable","Renvoyer un tableau au format JSON"],contenu:["## Renvoyer des valeurs simples","En fin de flux, l'action **« Répondre à une application ou un flux Power Apps »** déclare des **sorties** : texte, nombre, oui/non, date, e-mail. Dans l'application, le résultat de Run est un enregistrement qui contient ces sorties :",{code:`Set(gblResultat; EnvoyerAuManager.Run(galDemandes.Selected.ID; txtCommentaire.Text));;
Notify("Numéro de suivi : " & gblResultat.numerosuivi; NotificationType.Success)`},"Les noms de sorties sont convertis en minuscules côté Power Apps.","## Renvoyer un tableau","Pour renvoyer plusieurs lignes, on transforme le tableau en texte JSON dans le flux (sortie de type texte), puis on le relit dans l'application avec **ParseJSON** :",{code:`ClearCollect(colResultats;
    ForAll(Table(ParseJSON(MonFlux.Run().donnees));
        {Titre: Text(ThisRecord.Value.Titre);
         Montant: Value(ThisRecord.Value.Montant)}))`},"ParseJSON renvoie des valeurs non typées : il faut convertir chaque champ avec Text(), Value(), Boolean(), DateValue().","## Rendre l'attente visible","Pendant l'appel, l'utilisateur doit savoir qu'il se passe quelque chose :",{code:`UpdateContext({locChargement: true});;
Set(gblResultat; MonFlux.Run(...));;
UpdateContext({locChargement: false})`},"Un indicateur (icône ou texte « Envoi en cours… ») dont la propriété Visible vaut `locChargement`, et un bouton désactivé pendant ce temps, évitent les doubles clics."],notions:["Action « Répondre à une application ou un flux Power Apps »","Set(var; Flux.Run(…)) puis var.sortie","Tableaux : JSON texte + ParseJSON","Conversion des valeurs non typées","Indicateur de chargement, éviter les doubles clics"],ressources:[n("Fonction ParseJSON","power-platform/power-fx/reference/function-parsejson"),P.parseJson,n("Utiliser le volet Power Automate dans Power Apps","power-apps/maker/canvas-apps/working-with-flows")],recherche:"respond to a PowerApp or flow, ParseJSON Power Apps collection"},{id:"l7-3",title:"Scénarios courants",intro:"On applique tout dans des cas réels : envoyer un e-mail mis en forme, générer un PDF, déposer un fichier, lancer une approbation depuis l'application.",objectifs:["Envoyer un e-mail riche depuis l'application","Générer et stocker un document","Lancer une approbation et suivre son état dans l'application"],contenu:["## Envoyer un e-mail mis en forme","L'application transmet les informations ; le flux construit un e-mail en HTML (tableau, couleurs, lien vers l'application) et l'envoie, éventuellement depuis une boîte aux lettres partagée avec l'action « Envoyer un e-mail à partir d'une boîte aux lettres partagée ».","## Générer un PDF","Une méthode sans licence premium : le flux crée un fichier HTML dans OneDrive, utilise l'action OneDrive **« Convertir un fichier »** vers le format PDF, enregistre le PDF dans une bibliothèque SharePoint, puis renvoie son lien à l'application. L'application l'ouvre avec `Launch(gblResultat.lienpdf)`.","## Envoyer un fichier depuis l'application","Le déclencheur V2 accepte un paramètre de type **fichier**. Dans l'application, on passe le contenu d'un contrôle de pièces jointes ou d'une photo prise par l'appareil. Le flux enregistre ensuite le fichier où il faut (SharePoint, OneDrive).","## Approbation lancée depuis l'application","L'application crée la demande (Patch), puis appelle un flux qui lance l'approbation et met à jour le statut à la réponse. L'application n'attend pas la réponse (qui peut prendre des jours) : elle affiche simplement le statut lu dans la source de données.","## Où placer la logique ?","Une règle simple : dans l'**application** ce qui concerne l'affichage et la saisie ; dans un **flux** ce qui doit se passer côté serveur, prendre du temps, utiliser d'autres droits, ou se produire même si personne n'ouvre l'application. Les règles de données importantes gagnent à être dans la source (règle métier Dataverse) pour s'appliquer partout."],notions:["E-mail HTML et boîte partagée","PDF via OneDrive « Convertir un fichier »","Paramètre de type fichier","L'application n'attend pas une approbation","Interface dans l'app, traitements dans le flux, règles dans la source"],ressources:[p("YouTube","Power Apps generate PDF Power Automate","Plusieurs méthodes existent : comparez la date et les licences requises."),p("YouTube","Power Apps upload file to SharePoint Power Automate","Les vidéos de Shane Young et Reza Dorrani couvrent ce cas."),p("YouTube","Power Apps approval app Power Automate","Cherchez un exemple complet de bout en bout.")],recherche:"Power Apps send email with attachment flow, generate PDF, upload file"}],exercices:[{titre:"Mini-projet : app de demandes (v3)",enonce:"Reliez votre application à vos flux : à la soumission, l'application appelle un flux qui lance l'approbation du manager et renvoie un numéro de suivi affiché à l'écran.",livrable:"Une application de demande avec circuit d'approbation complet, de la saisie à la notification."},{titre:"Bon de demande en PDF",enonce:"Ajoutez un bouton « Télécharger le bon » qui génère un PDF de la demande via un flux et renvoie le lien à l'application.",livrable:"Un PDF généré et ouvert depuis l'application."}],quiz:[{q:"Quel déclencheur utiliser pour un flux appelé depuis Power Apps ?",options:["Périodicité","Lorsque Power Apps appelle un flux (V2)","Lorsqu'un e-mail arrive","Requête HTTP"],a:1,e:"Le déclencheur V2 gère les paramètres typés."},{q:"Comment lancer le flux « EnvoyerDemande » depuis un bouton ?",options:["EnvoyerDemande.Start()","EnvoyerDemande.Run(paramètres)","Run(EnvoyerDemande)","Navigate(EnvoyerDemande)"],a:1,e:"La méthode Run exécute le flux."},{q:"Comment renvoyer un résultat simple à l'application ?",options:["Envoyer un e-mail","Répondre à une application ou un flux Power Apps","Composer","Terminer"],a:1,e:"Cette action définit des sorties lisibles dans l'application."},{q:"Comment récupérer un tableau renvoyé par un flux ?",options:["Avec Search","En le renvoyant en texte JSON puis en utilisant ParseJSON","C'est impossible","Avec Navigate"],a:1,e:"ParseJSON lit le texte JSON ; on convertit ensuite chaque champ."},{q:"Après avoir modifié les paramètres d'un flux, que faut-il faire dans l'application ?",options:["Rien","Actualiser ou ajouter de nouveau le flux","Supprimer l'application","Changer de licence"],a:1,e:"L'application garde l'ancienne signature tant qu'on ne l'actualise pas."}]},W={id:"m8",num:8,title:"Niveau expert : industrialiser",intro:"Passer de « ça marche dans mon environnement » à « c'est déployé, maintenu et gouverné ». Ce module couvre l'ALM, la performance, les tests, la gouvernance et l'IA.",lessons:[{id:"l8-1",title:"Solutions et ALM",intro:"L'ALM (gestion du cycle de vie des applications) organise le passage du développement à la production. Les solutions regroupent applications, flux et tables pour les déplacer proprement.",objectifs:["Créer une solution et y ajouter des composants","Distinguer solution gérée et non gérée","Mettre en place développement, test et production"],contenu:["## Qu'est-ce qu'une solution ?","Une **solution** est un paquet qui contient tous les éléments d'un projet : applications, flux, tables, choix, variables d'environnement, rôles de sécurité… On l'exporte d'un environnement sous forme de fichier, puis on l'importe dans un autre. C'est la traduction concrète, dans la Power Platform, des étapes « déploiement » et « maintenance » du cycle de vie vu au module 1.","## Gérée ou non gérée","- **Non gérée** : modifiable. On l'utilise dans l'environnement de **développement**.","- **Gérée** : verrouillée, on ne peut pas modifier ses composants directement. On l'importe en **test** et en **production**. La supprimer retire proprement tous ses composants.","## L'éditeur et son préfixe","Chaque solution a un **éditeur** (publisher) avec un **préfixe** (par exemple `dmat_`) ajouté au nom technique de chaque table et colonne créées. Créez votre propre éditeur dès le début, plutôt que d'utiliser l'éditeur par défaut.","## Le circuit classique","Développement (solution non gérée) → export en solution gérée → import en test → recette → import en production. Chaque version porte un numéro (1.0.0.1, 1.0.0.2…) pour savoir ce qui est déployé où.",{astuce:"Prenez l'habitude de toujours créer vos applications et flux depuis une solution, jamais directement dans « Applications » ou « Mes flux ». Ajouter des éléments après coup est source d'oublis."}],notions:["Solution = paquet de composants","Non gérée (dev) / gérée (test, prod)","Éditeur et préfixe","Dev → test → prod avec numéros de version","Toujours travailler dans une solution"],ressources:[n("ALM avec Microsoft Power Platform","power-platform/alm/"),n("Solutions dans Power Apps","power-apps/maker/data-platform/solutions-overview"),p("YouTube","Power Platform solutions managed vs unmanaged","Cherchez une démonstration complète d'export/import.")],recherche:"Power Platform ALM solutions managed unmanaged publisher prefix"},{id:"l8-2",title:"Variables d'environnement et références de connexion",intro:"Une même solution doit fonctionner dans chaque environnement sans modification manuelle. Les variables d'environnement et les références de connexion le permettent.",objectifs:["Créer et utiliser une variable d'environnement","Utiliser des références de connexion","Déployer sans retoucher l'application"],contenu:["## Le problème","En développement, votre application pointe vers le site SharePoint « Demandes-DEV » et envoie les e-mails à votre adresse. En production, elle doit pointer vers « Demandes » et écrire au vrai service IT. Modifier l'application à chaque déploiement est risqué et contraire au principe de la solution gérée.","## Les variables d'environnement","Une **variable d'environnement** est un paramètre de la solution, avec une **valeur par défaut** et une **valeur actuelle** propre à chaque environnement. Types possibles : texte, nombre, oui/non, JSON, source de données (site et liste SharePoint), secret (Azure Key Vault). À l'import d'une solution, Power Platform demande la valeur à utiliser dans l'environnement cible.","## Les références de connexion","Une **référence de connexion** est un intermédiaire entre un flux et une connexion. Les flux de la solution utilisent la référence ; à l'import, on choisit quelle connexion réelle (quel compte) elle doit utiliser dans cet environnement. Plus besoin d'ouvrir chaque flux pour changer de compte.",{exemple:"Variable « dmat_EmailServiceIT » = it-dev@contoso.com en développement, it@contoso.com en production. Référence de connexion Outlook = votre compte en dev, un compte de service en production."}],notions:["Variable d'environnement : valeur par défaut et valeur actuelle","Types : texte, nombre, JSON, source de données, secret","Référence de connexion entre flux et connexion","Valeurs demandées à l'import"],ressources:[n("Utiliser des variables d'environnement dans les solutions","power-apps/maker/data-platform/environmentvariables"),n("Utiliser une référence de connexion dans une solution","power-apps/maker/data-platform/create-connection-reference")],recherche:"environment variables connection references solution import"},{id:"l8-3",title:"Pipelines de déploiement",intro:"Les pipelines automatisent le déploiement d'une solution d'un environnement à l'autre, avec traçabilité et, si besoin, des approbations.",objectifs:["Comprendre l'intérêt d'un pipeline","Déployer de développement vers test puis production","Connaître les alternatives (Azure DevOps, GitHub)"],contenu:["## Du manuel à l'automatique","Exporter et importer à la main fonctionne, mais on peut oublier une étape, se tromper de fichier ou de version. Un **pipeline** enregistre une fois pour toutes le chemin (dev → test → prod) et chaque déploiement devient un simple clic, depuis l'environnement de développement.","## Les pipelines intégrés","Les **pipelines dans Power Platform** sont configurés par un administrateur : il définit les environnements et les étapes. Le créateur choisit sa solution, l'étape cible, renseigne les variables d'environnement et lance le déploiement. Un historique garde la trace de qui a déployé quoi et quand. On peut ajouter une approbation avant la production.","## Aller plus loin : le contrôle de source","Les équipes plus avancées stockent leurs solutions dans **Git** (Azure DevOps ou GitHub) : chaque modification est versionnée, on peut comparer deux versions, revenir en arrière et automatiser les tests. Power Platform propose une intégration Git native, ainsi que des outils (Power Platform Build Tools, GitHub Actions) pour les pipelines CI/CD."],notions:["Pipeline : déploiement répétable et tracé","Configuré par l'administrateur, lancé par le créateur","Approbation avant production","Contrôle de source Git, CI/CD"],ressources:[n("Présentation des pipelines dans Power Platform","power-platform/alm/pipelines"),n("ALM avec Microsoft Power Platform","power-platform/alm/"),p("YouTube","Power Platform pipelines tutorial","Les pipelines évoluent : vérifiez la date de la vidéo.")],recherche:"Power Platform pipelines, git integration Power Platform"},{id:"l8-4",title:"Performance et optimisation",intro:"Une application lente est une application abandonnée. On apprend à mesurer et à améliorer le temps de chargement et la réactivité.",objectifs:["Identifier les causes de lenteur","Optimiser le démarrage","Réduire les appels aux données"],contenu:["## Les causes fréquentes","- Un **App.OnStart** surchargé qui charge plein de collections au démarrage.","- Des **LookUp dans chaque ligne d'une galerie** : 100 lignes = 100 appels à la source.","- Trop de contrôles sur un même écran (au-delà de quelques centaines).","- Des formules non délégables qui téléchargent beaucoup de données.","- De grandes images non optimisées.","## Les bonnes pratiques","- Remplacer le chargement initial par des **formules nommées**, évaluées seulement quand c'est nécessaire.","- Charger en parallèle ce qui doit l'être avec **Concurrent** :",{code:`Concurrent(
    ClearCollect(colCategories; Categories);
    ClearCollect(colServices; Services);
    Set(gblParametres; First(Parametres))
)`},"- Afficher seulement les colonnes nécessaires et filtrer à la source.","- Remplacer les LookUp de galerie par des colonnes déjà présentes dans la source, ou par une relation Dataverse.","- Activer **DelayItemLoading** sur les galeries et répartir les contrôles sur plusieurs écrans.","## Mesurer","Le **vérificateur d'application** signale des problèmes de performance. Le **Monitor** (surveillance en direct) affiche chaque appel aux données avec sa durée : idéal pour trouver l'appel qui ralentit tout."],notions:["OnStart surchargé, LookUp en galerie, trop de contrôles","Formules nommées plutôt qu'OnStart","Concurrent() pour paralléliser","Filtrer à la source, peu de colonnes","Mesurer avec Monitor et le vérificateur d'application"],ressources:[n("Conseils et bonnes pratiques de performance des applications canevas","power-apps/maker/canvas-apps/performance-tips"),n("Fonction Concurrent","power-platform/power-fx/reference/function-concurrent"),P.standards],recherche:"Power Apps performance tips Concurrent named formulas"},{id:"l8-5",title:"Tests et diagnostic",intro:"Tester systématiquement évite les régressions. Power Apps fournit des outils pour automatiser des tests et diagnostiquer en temps réel.",objectifs:["Rédiger un plan de test","Automatiser des tests","Diagnostiquer avec Monitor"],contenu:["## Le plan de test","On reprend la méthode du module 1 : chaque critère d'acceptation devient un cas de test (prérequis, actions, résultat attendu). Ajoutez des cas pour chaque rôle de sécurité (un demandeur ne doit pas voir les demandes des autres) et pour les cas limites (champ vide, grand volume, perte de réseau sur mobile).","## Automatiser","- **Test Studio** permet d'enregistrer des scénarios dans une application canevas (cliquer, saisir) et de vérifier des résultats avec la fonction **Assert**. On les rejoue après chaque modification pour détecter les régressions.","- **Power Apps Test Engine** est l'outil plus récent, qui exécute des tests décrits dans des fichiers, adaptés à l'intégration dans un pipeline.","## Diagnostiquer avec Monitor","Le **Monitor** (surveillance en direct) trace en temps réel tout ce que fait l'application : formules exécutées, appels réseau, erreurs, durées. On peut même surveiller la session d'un utilisateur qui rencontre un problème, avec son accord. C'est l'outil indispensable quand « ça ne marche pas chez moi ».","## La recette utilisateur","Avant la mise en production, faites tester l'application par quelques utilisateurs réels dans l'environnement de test, avec le plan de test. Leur validation formelle (recette) marque le feu vert pour le déploiement."],notions:["Plan de test à partir des critères d'acceptation","Test Studio et Assert","Power Apps Test Engine","Monitor : formules, appels réseau, erreurs","Recette utilisateur avant production"],ressources:[n("Test Studio","power-apps/maker/canvas-apps/test-studio"),n("Vue d'ensemble de la surveillance en direct (Monitor)","power-apps/maker/monitor-overview"),g("Test d'acceptation","Test_d%27acceptation")],recherche:"Power Apps Test Engine, Test Studio Assert, Monitor debugging"},{id:"l8-6",title:"Gouvernance et Centre d'excellence",intro:"À l'échelle d'une organisation, il faut encadrer la création : stratégies de données, inventaire des applications, accompagnement des créateurs.",objectifs:["Comprendre les stratégies de données (DLP)","Connaître les outils de gouvernance","Documenter et transmettre une solution"],contenu:["## Pourquoi gouverner ?","Quand des centaines de personnes créent des applications, les risques augmentent : données de l'entreprise envoyées vers des services personnels, applications critiques sans propriétaire, environnements en désordre. La gouvernance ne vise pas à empêcher la création, mais à la rendre sûre et durable.","## Les stratégies de données (DLP)","Une **stratégie de protection contre la perte de données** classe les connecteurs en groupes : **professionnel**, **non professionnel**, **bloqué**. Une applica
